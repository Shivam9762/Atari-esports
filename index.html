async function exportMyData(){
  if(!currentUser||!cloudDb){toast('Please sign in first.','error');return}
  try{
    const uid=currentUser.uid;
    const [u,wr,wd]=await Promise.all([
      cloudDb.collection('users').doc(uid).get(),
      cloudDb.collection('wallet_requests').where('userId','==',uid).get().catch(()=>null),
      cloudDb.collection('withdrawal_requests').where('userId','==',uid).get().catch(()=>null)
    ]);
    const prof=u.exists?(u.data()||{}):{};
    const str=v=>typeof v==='string'?v:'';
    const num=v=>Number.isFinite(Number(v))?Number(v):0;
    const when=v=>{if(!v)return '';if(typeof v==='object'&&typeof v.seconds==='number')return new Date(v.seconds*1000).toISOString();if(typeof v==='number'){const d=new Date(v);return isNaN(d)?'':d.toISOString()}return str(v)};
    /* Clean export: only whitelisted fields are copied, so avatars, Base64 images, payment screenshots, UTRs and UPI details can never end up in the file. */
    const byDate=(a,b)=>String(b.date).localeCompare(String(a.date));
    const walletHistory={
      currentDepositBalance:num(state.profile&&state.profile.walletBalance),
      currentBonusBalance:num(state.profile&&state.profile.bonusBalance),
      currentWinningsBalance:num(state.profile&&state.profile.winningsBalance),
      deposits:(wr?wr.docs:[]).map(d=>{const x=d.data()||{};return {amount:num(x.amount),bonus:num(x.bonus),status:str(x.status),date:when(x.createdAt)}}).sort(byDate),
      withdrawals:(wd?wd.docs:[]).map(d=>{const x=d.data()||{};return {amount:num(x.amount),status:str(x.status),date:when(x.createdAt),paidOn:when(x.paidAt)}}).sort(byDate)
    };
    const tournamentHistory=(state.tournaments||[]).flatMap(t=>(t.registrations||[]).filter(r=>r.playerOwner===uid).map(r=>({tournamentName:str(t.name),teamName:str(r.teamName),status:str(r.status),registeredOn:when(r.createdAt)})));
    const data={displayName:str(prof.displayName)||str(state.profile&&state.profile.displayName),city:str(prof.city)||str(state.profile&&state.profile.city),tournamentHistory,walletHistory};
    const jsonString=JSON.stringify(data,null,2);
    const blob=new Blob([jsonString],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='atari-my-data.json';a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},0);
    toast('\u2705 Data exported successfully! Check your phone\'s Downloads folder.','success export');
  }catch(ex){console.error(ex);toast('Could not export your data. Please try again.','error')}
}

/* ===== Admin: data retention clean-up (the existing cleanupOldData() is the 5-day PLAYER clean-up and is left untouched) ===== */
async function cleanupOldAdminData(){
  if(!currentUser||!cloudDb||!isAdminEmail())return;
  const DAY=86400000,now=Date.now();
  const cutoff30Days=now-(30*DAY);
  const cutoff60Days=now-(60*DAY);
  const cutoff15Days = Date.now() - (15 * 24 * 60 * 60 * 1000);
  const plan=[['wallet_requests',cutoff30Days,['APPROVED','REJECTED'],false],['withdrawal_requests',cutoff60Days,['PAID','REJECTED'],true],['used_utrs',cutoff30Days,null,false],['system_logs',cutoff15Days,null,false]];
  let removed=0;
  try{
    for(const [col,cutoff,statuses,isTs] of plan){
      const snap=await cloudDb.collection(col).where('createdAt','<',isTs?new Date(cutoff):cutoff).limit(500).get();
      const docs=snap.docs.filter(d=>!statuses||statuses.includes(String(d.data().status||'').toUpperCase()));
      for(let i=0;i<docs.length;i+=400){const b=cloudDb.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();removed+=Math.min(400,docs.length-i)}
    }
    if(removed>0)toast('Old data cleaned up successfully.','success');
  }catch(e){console.warn('Admin data clean-up could not finish:',e&&e.message||e)}
}

/* ===== Admin: Incident Log (security_incidents) ===== */
const INC={list:[],loaded:false,loading:false,err:''};
async function incLoad(force){
  if(INC.loading||(INC.loaded&&!force))return;
  INC.loading=true;
  try{const s=await cloudDb.collection('security_incidents').orderBy('createdAt','desc').limit(50).get();INC.list=s.docs.map(d=>({id:d.id,...d.data()}));INC.err=''}
  catch(e){INC.err=e&&e.code==='permission-denied'?'Permission denied. Publish the updated firestore.rules.':(e&&e.message)||'Could not load incidents.'}
  INC.loaded=true;INC.loading=false;
  if(ui.page==='updates'&&AI.tab==='Incidents')render();
}
function incHtml(){
  if(!INC.loaded&&!INC.loading)incLoad();
  const head=`<div class="card"><div class="row between"><h2>🚨 Incident Log</h2><button class="btn smallbtn" onclick="incLoad(true)">↻ Refresh</button></div><p class="muted small">Record every security incident (data leak, unauthorised access, payment fraud). A personal-data breach may have to be reported to the Data Protection Board and to affected users - keep this log accurate.</p><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary smallbtn" onclick="openIncidentModal()">＋ Report New Incident</button><button class="btn danger smallbtn" onclick="notifyAllUsersSecurity()">📢 Notify All Users</button></div></div>`;
  if(INC.loading&&!INC.loaded)return head+'<p class="muted small">Loading incidents…</p>';
  if(INC.err)return head+`<p style="color:#f87171" class="small">${esc(INC.err)}</p>`;
  if(!INC.list.length)return head+'<p class="muted small">No incidents recorded.</p>';
  const tm=x=>x?new Date(Number(x)).toLocaleString():'—';
  return head+INC.list.map(i=>`<div class="card"><div class="row between"><strong>${esc(i.type||'Incident')}</strong><span class="badge">${esc(i.status||'OPEN')}</span></div><div class="muted small">${tm(i.createdAt)}${i.reportedByEmail?' · '+esc(i.reportedByEmail):''}</div><p class="small" style="white-space:pre-wrap"><b>What happened:</b> ${esc(i.description||'')}</p><p class="small" style="white-space:pre-wrap"><b>Action taken:</b> ${esc(i.actionTaken||'—')}</p></div>`).join('');
}
function openIncidentModal(){
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  openModal('🚨 Report New Incident',`<form onsubmit="submitIncident(event)"><div class="field"><label>Type</label><select name="type" required><option>Unauthorised access</option><option>Data leak / breach</option><option>Fake or duplicate payment</option><option>Account takeover</option><option>Bug exploit / vulnerability</option><option>Other</option></select></div><div class="field"><label>Description</label><textarea name="description" rows="4" maxlength="2000" required></textarea></div><div class="field"><label>Action taken</label><textarea name="actionTaken" rows="3" maxlength="2000"></textarea></div><button class="btn primary full" type="submit">Save Incident</button></form>`);
}
async function submitIncident(e){
  e.preventDefault();
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  const f=new FormData(e.currentTarget),type=String(f.get('type')||'').trim(),description=String(f.get('description')||'').trim(),actionTaken=String(f.get('actionTaken')||'').trim();
  if(!type||!description){toast('Please fill the type and description.','error');return}
  try{
    await cloudDb.collection('security_incidents').add({type,description,actionTaken,status:'OPEN',reportedBy:currentUser.uid,reportedByEmail:currentUser.email||'',createdAt:Date.now()});
    logEvent('Security incident recorded: '+type);
    closeModal();toast('Incident saved.','success');incLoad(true);
  }catch(ex){console.error(ex);toast(ex.code==='permission-denied'?'Permission denied. Publish the updated firestore.rules.':(ex.message||'Could not save incident.'),'error')}
}
function notifyAllUsersSecurity(){
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  if(!confirm('Send this push notification to ALL users?\n\n⚠️ Security Notice: Please change your password immediately.'))return;
  triggerPushNotification('⚠️ Security Notice','Please change your password immediately.');
  logEvent('Security notice sent to all users');
  toast('Security notice sent to all users.','success');
}

/* ===== ADMIN: Reports, User Search, Broadcast notification ===== */
const RPT={loaded:false,loading:false,data:null,err:''};
const USR={q:'',results:null,loading:false,err:''};
const _admTs=x=>x&&typeof x.toMillis==='function'?x.toMillis():(Number(x)||0);
const _admDate=x=>{const t=_admTs(x);return t?new Date(t).toLocaleString():'—'};
async function loadAdminReport(){
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  RPT.loading=true;RPT.err='';render();
  try{
    const LIM=300;
    const cnt=async q=>{if(typeof q.count==='function'){try{const s=await q.count().get();return s.data().count}catch(e){}}const s=await q.get();return s.size};
    const U=cloudDb.collection('users'),WR=cloudDb.collection('wallet_requests'),WD=cloudDb.collection('withdrawal_requests');
    const [users,pendW,pendD]=await Promise.all([cnt(U),cnt(WR.where('status','==','PENDING')),cnt(WD.where('status','==','PENDING'))]);
    const [ap,pd]=await Promise.all([WR.where('status','==','APPROVED').limit(LIM).get(),WD.where('status','==','PAID').limit(LIM).get()]);
    const sum=sn=>sn.docs.reduce((t,d)=>t+(Number(d.data().amount)||0),0);
    /* Today's new users + which of them booked a tournament slot */
    let newUsers=[],newUsersErr=false;
    try{
      const startOfToday=new Date();startOfToday.setHours(0,0,0,0);
      const found=new Map();
      const grab=async v=>{try{const sn=await U.where('createdAt','>=',v).limit(500).get();sn.docs.forEach(doc=>found.set(doc.id,{uid:doc.id,...doc.data()}))}catch(e){console.warn('New-user query failed',e)}};
      await Promise.all([grab(firebase.firestore.Timestamp.fromDate(startOfToday)),grab(startOfToday.getTime())]);
      newUsers=Array.from(found.values()).filter(u=>_admTs(u.createdAt)>=startOfToday.getTime()).sort((a,b)=>_admTs(b.createdAt)-_admTs(a.createdAt));
    }catch(e){console.warn(e);newUsersErr=true}
    let tourList=Array.isArray(state.tournaments)?state.tournaments:[];
    try{const ts=await cloudDb.collection('tournaments').get();tourList=ts.docs.map(doc=>({id:doc.id,...doc.data()}))}catch(e){console.warn('Using cached tournaments for new-user report',e)}
    const bookedMap=new Map();
    tourList.forEach(t=>{(Array.isArray(t&&t.registrations)?t.registrations:[]).forEach(r=>{if(!r||!r.playerOwner||['REJECTED','REMOVED'].includes(r.status))return;if(!bookedMap.has(r.playerOwner))bookedMap.set(r.playerOwner,[]);const nm=String(t.name||'Tournament');const arr=bookedMap.get(r.playerOwner);if(!arr.includes(nm))arr.push(nm)})});
    const newUserRows=newUsers.map(u=>({uid:u.uid,name:u.displayName||u.bgmiName||'Player',email:u.email||'',createdAt:_admTs(u.createdAt),tournaments:bookedMap.get(u.uid)||[]}));
    const newActive=newUserRows.filter(u=>u.tournaments.length>0),newInactive=newUserRows.filter(u=>!u.tournaments.length);
    RPT.data={users,deposits:sum(ap),depositCount:ap.size,withdrawals:sum(pd),withdrawalCount:pd.size,pendW,pendD,partial:ap.size>=LIM||pd.size>=LIM,newToday:newUserRows.length,newBooked:newActive.length,newActive,newInactive,newUsersErr,at:Date.now()};
    RPT.loaded=true;
  }catch(e){console.error(e);RPT.err=e&&e.code==='permission-denied'?'Permission denied. Check firestore.rules.':(e&&e.message)||'Could not load the report.'}
  RPT.loading=false;
  if(ui.page==='updates'&&AI.tab==='Reports')render();
}
function reportHtml(){
  const d=RPT.data;
  const head=`<div class="card"><div class="row between"><h2>📊 Reports</h2><button class="btn smallbtn" onclick="loadAdminReport()">${RPT.loaded?'↻ Refresh':'Load report'}</button></div><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn primary smallbtn" onclick="openBroadcastModal()">📢 Send Notification to All</button></div></div>`;
  if(RPT.loading)return head+'<p class="muted small">Loading report…</p>';
  if(RPT.err)return head+`<p class="small" style="color:#f87171">${esc(RPT.err)}</p>`;
  if(!d)return head+'<p class="muted small">Tap <b>Load report</b> to fetch the latest numbers. (It reads your payment records, so it is not loaded automatically.)</p>';
  return head+`<div class="card"><div class="grid2"><div class="metric"><span>TOTAL USERS</span><strong>${money(d.users)}</strong></div><div class="metric"><span>PENDING APPROVALS</span><strong>${money(d.pendW+d.pendD)}</strong></div></div><div class="grid2" style="margin-top:9px"><div class="metric"><span>WALLET DEPOSITS (APPROVED)</span><strong>₹${money(d.deposits)}</strong></div><div class="metric"><span>WITHDRAWALS (PAID)</span><strong>₹${money(d.withdrawals)}</strong></div></div><div class="metric" style="margin-top:9px"><span>NEW USERS WHO BOOKED SLOTS</span><strong>${money(d.newBooked||0)}<small class="muted"> out of ${money(d.newToday||0)} new today</small></strong></div><p class="muted small" style="margin:10px 0 0">Pending: ${d.pendW} deposit request(s) + ${d.pendD} withdrawal request(s). Deposits from ${d.depositCount} approved request(s); withdrawals from ${d.withdrawalCount} paid request(s).</p><p class="muted small" style="margin:6px 0 0">Totals count only the records still stored - completed requests are auto-deleted after 30 days (deposits) and 60 days (withdrawals)${d.partial?', and only the first 300 records of each are summed':''} - so they show recent activity, not lifetime totals. Updated ${new Date(d.at).toLocaleTimeString()}.</p></div>${newUsersReportHtml(d)}`;
}
function newUsersReportHtml(d){
  const row=(u,booked)=>`<div style="padding:10px 0;border-top:1px solid var(--line)"><div class=\"row between\" style=\"gap:8px;align-items:flex-start\"><div class=\"grow\" style=\"min-width:0\"><strong>${esc(u.name)}</strong><div class=\"muted small\" style=\"word-break:break-all\">${esc(u.email||'No email')}</div></div><span class=\"badge\" style=\"background:#facc15;color:#302300;white-space:nowrap\">NEW TODAY</span></div>${booked?`<div class=\"muted small\" style=\"margin-top:6px\">🎮 ${u.tournaments.map(n=>esc(n)).join(' · ')}</div>`:`<div class=\"muted small\" style=\"margin-top:6px\">Joined ${u.createdAt?new Date(u.createdAt).toLocaleTimeString():'today'} · no booking yet</div>`}</div>`;
  const box=l=>`<div style=\"max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch\">${l}</div>`;
  const a=d.newActive||[],b=d.newInactive||[];
  return `<div class=\"card\"><h3>✅ New Users Who Booked Slots (${a.length})</h3>${d.newUsersErr?'<p class=\"small\" style=\"color:#f87171\">Could not load today\'s new users.</p>':''}${a.length?box(a.map(u=>row(u,true)).join('')):'<p class=\"muted small\">No new user has booked a slot today yet.</p>'}</div><div class=\"card\"><h3>🕒 New Users (No Booking Yet) (${b.length})</h3>${b.length?box(b.map(u=>row(u,false)).join('')):'<p class=\"muted small\">No pending new users today.</p>'}</div>`;
}
async function searchAdminUsers(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  const q=String(new FormData(e.currentTarget).get('q')||'').trim();
  USR.q=q;USR.err='';
  if(!q){USR.results=null;render();return}
  USR.loading=true;render();
  try{
    const C=cloudDb.collection('users'),jobs=[];
    if(q.indexOf('@')>-1){jobs.push(C.where('email','==',q).limit(5).get());if(q!==q.toLowerCase())jobs.push(C.where('email','==',q.toLowerCase()).limit(5).get())}
    else jobs.push(C.where('bgmiId','==',q).limit(5).get());
    const snaps=await Promise.all(jobs),seen={};USR.results=[];
    snaps.forEach(sn=>sn.docs.forEach(d=>{if(!seen[d.id]){seen[d.id]=1;USR.results.push({id:d.id,...d.data()})}}));
  }catch(ex){console.error(ex);USR.results=null;USR.err=ex&&ex.code==='permission-denied'?'Permission denied. Check firestore.rules.':(ex&&ex.message)||'Search failed.'}
  USR.loading=false;render();
}
function userSearchHtml(){
  let body='';
  if(USR.loading)body='<p class="muted small">Searching…</p>';
  else if(USR.err)body=`<p class="small" style="color:#f87171">${esc(USR.err)}</p>`;
  else if(USR.results&&!USR.results.length)body='<p class="muted small">No user found for that email / BGMI ID.</p>';
  else if(USR.results)body=USR.results.map(u=>{
    const regs=(state.tournaments||[]).reduce((n,t)=>n+((t.registrations||[]).filter(r=>r.playerOwner===u.id).length),0);
    const dep=Number(u.walletBalance)||0,bon=Number(u.bonusBalance)||0,win=Number(u.winningsBalance)||0;
    return `<div class="card"><div class="row between"><strong>${esc(u.displayName||'Player')}</strong>${u.banned||u.isBanned?'<span class="badge" style="background:#dc2626;color:#fff">BANNED</span>':''}</div><div class="muted small" style="word-break:break-all">${esc(u.email||'—')}</div><div class="muted small">BGMI: ${esc(u.bgmiName||'—')} · ID ${esc(u.bgmiId||'—')}</div><div class="grid2" style="margin-top:8px"><div class="metric"><span>WALLET</span><strong>₹${money(dep+bon+win)}</strong></div><div class="metric"><span>TOURNAMENTS</span><strong>${regs}</strong></div></div><p class="muted small" style="margin:6px 0 0">Deposit ₹${money(dep)} · Bonus ₹${money(bon)} · Winnings ₹${money(win)}</p><div class="actions"><button class="btn smallbtn" onclick="viewUserHistory('${esc(u.id)}')">View Full History</button></div></div>`}).join('');
  return `<div class="card"><h2>🔍 Search User</h2><form onsubmit="searchAdminUsers(event)" style="display:flex;gap:8px"><input class="control" name="q" value="${esc(USR.q)}" placeholder="Email or BGMI ID" autocomplete="off" style="flex:1;min-width:0"><button class="btn primary smallbtn" type="submit">Search</button></form></div>${body}`;
}
async function viewUserHistory(uid){
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  openModal('Full History','<p class="muted small">Loading…</p>');
  try{
    const [wr,wd]=await Promise.all([cloudDb.collection('wallet_requests').where('userId','==',uid).get(),cloudDb.collection('withdrawal_requests').where('userId','==',uid).get()]);
    const rows=[...wr.docs.map(d=>({k:'Deposit',...d.data()})),...wd.docs.map(d=>({k:'Withdrawal',...d.data()}))].sort((a,b)=>_admTs(b.createdAt)-_admTs(a.createdAt));
    const list=rows.length?rows.map(r=>`<div class="card" style="margin:8px 0"><div class="row between"><strong>${r.k} ₹${money(r.amount)}</strong><span class="badge">${esc(r.status||'—')}</span></div><div class="muted small">${_admDate(r.createdAt)}</div>${r.utr?`<div class="muted small">UTR: ${esc(r.utr)}</div>`:''}${r.upiId?`<div class="muted small">UPI: ${esc(r.upiId)}</div>`:''}</div>`).join(''):'<p class="muted small">No deposits or withdrawals on record (completed ones are auto-deleted after 30/60 days).</p>';
    openModal('Full History',`<div style="max-height:60vh;overflow:auto">${list}</div><div class="actions"><button class="btn primary" onclick="closeModal()">Close</button></div>`);
  }catch(ex){console.error(ex);openModal('Full History',`<p style="color:#f87171">${esc((ex&&ex.message)||'Could not load history.')}</p><div class="actions"><button class="btn primary" onclick="closeModal()">Close</button></div>`)}
}
function openBroadcastModal(){
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  openModal('📢 Send Notification to All',`<form onsubmit="submitBroadcast(event)"><div class="field"><label>Title</label><input name="title" maxlength="80" required></div><div class="field"><label>Message</label><textarea name="message" rows="4" maxlength="250" required></textarea></div><button class="btn primary full" type="submit">Send to all users</button></form>`);
}
function submitBroadcast(e){
  e.preventDefault();
  if(!isAdminEmail()){toast('Unauthorized','error');return}
  const f=new FormData(e.currentTarget),title=String(f.get('title')||'').trim(),message=String(f.get('message')||'').trim();
  if(!title||!message){toast('Please enter a title and a message.','error');return}
  if(!confirm('Send this notification to ALL users?\n\n'+title+'\n'+message))return;
  triggerPushNotification(title,message);
  logEvent('Broadcast notification sent: '+title);
  closeModal();toast('Notification request sent to all users.','success');
}
