<script>
'use strict';
const ADMIN_EMAIL = "atariesports@proton.me"; /* admin login email (put the admin UID in firestore.rules too) */
/* ===== Simple client-side rate limit: 1 deposit / 1 registration per minute ===== */
function _atariRateLimited(kind){try{const k='atari_last_'+kind+'_'+(currentUser?currentUser.uid:'x');const last=Number(localStorage.getItem(k))||0;if(Date.now()-last<60000){toast('Please wait a minute before submitting again.','error');return true}localStorage.setItem(k,String(Date.now()))}catch(e){}return false}
function _atariRateClear(kind){try{localStorage.removeItem('atari_last_'+kind+'_'+(currentUser?currentUser.uid:'x'))}catch(e){}}
/* ===== OneSignal login/logout bridge for Median (native app wrapper) ===== */
function _atariIsMedian(){try{return window.navigator.userAgent.toLowerCase().indexOf('median')>-1&&window.median&&median.onesignal}catch(e){return false}}
function _atariMedianLogin(){try{if(_atariIsMedian()){_atariMedianForegroundOff();const em=String((currentUser&&currentUser.email)||(state&&state.profile&&state.profile.email)||'').trim().toLowerCase();if(em)median.onesignal.login(em)}}catch(e){console.warn('Median login failed',e)}}
function _atariShowApkGate(){
  try{
    if(_atariIsMedian()||_atariIsStandalone())return; /* never inside the Median app or an installed web app */
    if(!currentUser||document.getElementById('apk-gate'))return;
    if(window._apkGateUid===currentUser.uid)return; /* once per login */
    window._apkGateUid=currentUser.uid;
    const g=document.createElement('div');g.id='apk-gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-label','Download the app');
    g.style.cssText='position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 0%,#3b2563 0%,#120e17 70%);color:#fff;overflow:auto';
    g.innerHTML='<div style="max-width:420px;width:100%"><div style="font-size:64px;line-height:1">📲</div><h1 style="font-size:28px;line-height:1.2;margin:18px 0 10px">Get the Atari Esports App</h1><p style="color:#b9a9d0;font-size:16px;margin:0 0 28px">Download it to receive tournament notifications.</p><a href="https://velvety-babka-f44f0b.netlify.app/Atari.zip" download style="display:block;background:#f8c347;color:#1d1524;font-weight:900;font-size:20px;padding:18px 20px;border-radius:16px;text-decoration:none;box-shadow:0 10px 30px #f8c34744">📥 Download APK</a></div>';
    document.body.appendChild(g);document.body.style.overflow='hidden';
  }catch(e){console.warn('APK gate failed',e)}
}
function _atariHideApkGate(){const g=document.getElementById('apk-gate');if(g)g.remove();document.body.style.overflow=''}
function _atariMedianLogout(){try{if(_atariIsMedian())median.onesignal.logout()}catch(e){console.warn('Median logout failed',e)}}
function isAdminEmail(){try{return !!(currentUser&&typeof currentUser.email==='string'&&currentUser.email.toLowerCase()===ADMIN_EMAIL)}catch(e){return false}}
/* ===== OneSignal push via Netlify Function (REST key stays server-side) ===== */
const PUSH_ENDPOINT='https://velvety-babka-f44f0b.netlify.app/.netlify/functions/send-notification'; /* if the app runs inside an APK/other origin, use your full https://YOUR-SITE.netlify.app/.netlify/functions/send-notification */
/* sendSmartNotification(title,message,targetUserId): targetUserId = OneSignal External ID (the user's email) or an array of them. null = broadcast to everyone.
   Never throws, never touches the UI. An empty target list sends NOTHING (it must never turn into a broadcast). */
async function sendSmartNotification(title,message,targetUserId=null,extra={}){
  try{
    const hasTarget=Array.isArray(targetUserId)?targetUserId.length>0:!!targetUserId;
    if(targetUserId!==null&&targetUserId!==undefined&&!hasTarget)return false;
    const headers={'Content-Type':'application/json'};
    if(currentUser&&typeof currentUser.getIdToken==='function'){headers['Authorization']='Bearer '+await currentUser.getIdToken()}
    const payload={title:String(title||''),message:String(message||''),...(hasTarget?{targetUserId}:{}),...(extra&&typeof extra==='object'?extra:{})};
    const r=await fetch(PUSH_ENDPOINT,{method:'POST',headers,body:JSON.stringify(payload)});
    if(!r.ok)console.warn('Push notification failed:',r.status);
    return r.ok;
  }catch(e){console.warn('Push notification failed:',e);return false}
}
async function triggerPushNotification(title,message,target){return sendSmartNotification(title,message,target||null,target?{}:{broadcast:true})}
async function testNotification() {
  toast('Sending test notification...', 'success');
  const result = await sendSmartNotification('Test Title', 'This is a test notification from Atari Esports!', null, {broadcast: true});
  if (result) {
    toast('Notification sent successfully! Check your phone.', 'success');
  } else {
    toast('Notification failed. Check console.', 'error');
  }
}
/* ===== Push rules: OneSignal pushes are shown ONLY when the user is outside the app. Inside the app (foreground) Median suppresses them. ===== */
const PUSH_TARGETING=true; /* requires the updated netlify/functions/send-notification.js (accepts targetUserId). Deploy it BEFORE this page. */
function _atariMedianForegroundOff(){try{if(_atariIsMedian()&&median.onesignal.enableForegroundNotifications)median.onesignal.enableForegroundNotifications(false)}catch(e){console.warn('Foreground push setting failed',e)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)_atariMedianForegroundOff()});
async function atariPushUsers(uids,title,message){ /* targeted push; does nothing unless PUSH_TARGETING is on */
  if(!PUSH_TARGETING||!cloudDb)return false;
  try{
    const emails=[];
    for(const u of [...new Set(uids)].filter(Boolean)){
      if(u==='__admin__'){const adminEmail=String(ADMIN_EMAIL||'').trim().toLowerCase();if(adminEmail)emails.push(adminEmail);continue}
      const sn=await cloudDb.collection('users').doc(String(u)).get();const em=sn.exists&&sn.data().email;if(em)emails.push(String(em).trim().toLowerCase());
    }
    const targets=[...new Set(emails)].filter(Boolean);
    if(!targets.length){console.warn('Targeted push skipped: no OneSignal External ID found for',uids);return false}
    const ok=await triggerPushNotification(title,message,targets.length===1?targets[0]:targets);
    if(!ok)console.warn('Targeted push endpoint did not confirm delivery:',title);
    return ok;
  }catch(e){console.warn('Targeted push failed',e);return false}
}
function atariPushTournament(t,title,message,acceptedOnly){ /* only the tournament's own teams; never a broadcast */
  if(!t)return;
  const ok=r=>acceptedOnly?r.status==='ACCEPTED':!['REJECTED','REMOVED','REFUNDED'].includes(r.status);
  const uids=(t.registrations||[]).filter(r=>r.playerOwner&&ok(r)).map(r=>r.playerOwner);
  if(uids.length)atariPushUsers(uids,title,message);
}
async function _atariMatchPush(t,d,prev,isNew,matchId){

function syncBookedOverridesFromSnapshot(snap){

    if(Number(x.slots)>0&&Number(lt.slots)!==Number(x.slots)){lt.slots=Number(x.slots);changed=true}

}

function calcStandings(t){
 /* Tie-breaker: teams level on Total Points AND Total Kills -> the one with the better PREVIOUS rank (rank before the latest completed match) gets +1 point. */
 const build=ms=>{const map=new Map();for(const m of ms){for(const res of (m.results||[])){if(!res||res.valid===false)continue;const teamId=res.teamId||res.registrationId;const reg=t.registrations.find(r=>r.id===res.registrationId);const name=res.teamName||(reg&&reg.teamName)||'Unknown team';if(!map.has(teamId))map.set(teamId,{teamId,teamName:name,matches:0,placementPoints:0,finishPoints:0,total:0,kills:0,bonus:0});const s=map.get(teamId);const pp=(t.scoringConfig||[]).find(x=>+x.position===+res.placement);const placementPoints=pp?+pp.points:0;const kills=Math.max(0,parseInt(res.kills)||0);const finishPoints=kills*(Number.isFinite(+t.pointsPerKill)?+t.pointsPerKill:1);s.matches++;s.placementPoints+=placementPoints;s.finishPoints+=finishPoints;s.kills+=kills;s.total+=placementPoints+finishPoints}}return [...map.values()]};
 const done=(t.matches||[]).filter(m=>m.status==='COMPLETED');
 const prevRank=new Map();
 if(done.length>1)build(done.slice(0,-1)).sort((a,b)=>b.total-a.total||b.kills-a.kills||a.teamName.localeCompare(b.teamName)).forEach((x,i)=>prevRank.set(x.teamId,i+1));
 const pr=id=>prevRank.has(id)?prevRank.get(id):1e9;
 const rows=build(done),groups=new Map();
 rows.forEach(x=>{const k=x.total+'|'+x.kills;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});
 groups.forEach(g=>{if(g.length<2)return;g.sort((a,b)=>pr(a.teamId)-pr(b.teamId));if(pr(g[0].teamId)<pr(g[1].teamId)){g[0].bonus=1;g[0].total+=1}});
 return rows.sort((a,b)=>b.total-a.total||b.kills-a.kills||pr(a.teamId)-pr(b.teamId)||a.teamName.localeCompare(b.teamName)).map((x,i)=>({...x,rank:i+1}))}
function renderStandings(t,organizer){const rows=calcStandings(t);return `<div class="row between"><div><h2>Standings</h2><p class="muted small">${rows.length?'Calculated from completed match results':'No confirmed results yet'}</p></div>${organizer?`<button class="btn primary smallbtn" onclick="openResults('${t.id}')">＋ Enter Results</button>`:''}</div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>M</th><th>PP</th><th>FP</th><th>Total</th></tr></thead><tbody>${rows.map(s=>`<tr><td class="rank">#${s.rank}</td><td>${esc(s.teamName)}</td><td>${s.matches}</td><td>${s.placementPoints}</td><td>${s.finishPoints}</td><td><strong>${s.total}</strong></td></tr>`).join('')}</tbody></table></div><p class="hint">Tie-break order: total points, finish points, placement points, then team name.</p>`:empty('Standings will appear here','When the organizer saves completed match results, points and rankings are calculated automatically.')}`}

const tcPressTimers={};function startTcLongPress(ev,tid,id){if(!currentUser||ui.role!=='organizer'||(ev&&ev.button!==undefined&&ev.button!==0))return;cancelTcLongPress(id);const el=ev&&ev.currentTarget;tcPressTimers[id]=setTimeout(()=>{delete tcPressTimers[id];if(!el||!el.isConnected||el.querySelector('.tc-delete-action'))return;const b=document.createElement('button');b.type='button';b.className='btn danger smallbtn tc-delete-action';b.textContent='🗑️ Delete Message';b.style.marginTop='8px';b.onclick=e=>{e.stopPropagation();deleteTournamentChatMessage(tid,id);b.disabled=true;b.textContent='Deleting…'};el.appendChild(b)},600)}function cancelTcLongPress(id){if(tcPressTimers[id]){clearTimeout(tcPressTimers[id]);delete tcPressTimers[id]}}async function deleteTournamentChatMessage(tid,id){try{if(ui.role!=='organizer')throw Error('Admin access required.');await cloudDb.collection('tournaments').doc(String(tid)).collection('chatMessages').doc(String(id)).delete();toast('Tournament message deleted.','success')}catch(e){toast(e.message||'Could not delete message.','error')}}

async function deleteTournamentPermanently(id){
 const t=getT(id);if(!t){closeModal();toast('Tournament not found.','error');return}
 if(!cloudDb||!currentUser||!cloudReady){toast('Please sign in and connect to Firestore before deleting a tournament.','error');return}
 const btn=document.getElementById('confirm-delete-tournament-btn');if(btn){btn.disabled=true;btn.textContent='Deleting…'}
 try{
   await cloudDb.collection('tournaments').doc(String(id)).delete();
   state.tournaments=state.tournaments.filter(x=>String(x.id)!==String(id));
   state.savedTournamentIds=(state.savedTournamentIds||[]).filter(x=>String(x)!==String(id));
   state.recentTournamentIds=(state.recentTournamentIds||[]).filter(x=>String(x)!==String(id));
   if(String(ui.selectedTournamentId)===String(id))ui.selectedTournamentId=null;
   if(ui.page==='organizer-detail'||ui.page==='tournament-detail')ui.page=ui.role==='organizer'?'tournaments':'battle';
   closeModal();render();toast('Tournament deleted.','success');
 }catch(ex){console.error('Tournament delete failed:',ex);if(btn){btn.disabled=false;btn.textContent='🗑️ Delete Permanently'}toast('Could not delete tournament. Check Firestore permissions and connection.','error')}
}
function setRegistrationStatus(id,status){const t=getT(id);if(!t)return;const ok=mutate(()=>{t.registrationStatus=status;if(status==='OPEN'){if(['REG. PAUSED','REG. CLOSED'].includes(t.status))t.status='REG. OPEN';}else if(status==='PAUSED')t.status='REG. PAUSED';else t.status='REG. CLOSED';t.updatedAt=now()},`Registration ${status.toLowerCase()}`);if(ok)render()}
function confirmCancelTournament(id){openModal('Cancel tournament?',`<p class="muted">This will cancel the tournament and refund the entry fee to all ACCEPTED teams. Historical registrations, matches and results will be preserved.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Keep tournament</button><button class="btn danger" onclick="cancelAndRefundTournament('${id}')">Cancel Tournament</button></div>`)}
let _cancelRefundBusy=false;
async function cancelAndRefundTournament(id){
 if(_cancelRefundBusy)return;
 const t=getT(id);if(!t){closeModal();toast('Tournament not found.','error');return}
 if(!cloudDb||!currentUser||!cloudReady){toast('Please sign in and connect to Firestore before cancelling a tournament.','error');return}
 _cancelRefundBusy=true;
 const buttons=document.querySelectorAll('#modal-root button');buttons.forEach(b=>b.disabled=true);
 try{
  const FV=firebase.firestore.FieldValue,tourRef=cloudDb.collection('tournaments').doc(String(id));
  const snap=await tourRef.get();
  if(!snap.exists)throw Error('Tournament no longer exists.');
  const td=snap.data()||{};
  const regs=Array.isArray(td.registrations)?td.registrations:[];
  /* Already cancelled: never refund twice. Just sync local state. */
  if(td.status==='CANCELLED'){
   t.status='CANCELLED';t.registrationStatus='CLOSED';t.registrations=regs;
   closeModal();render();toast('Tournament is already cancelled.','warning');return;
  }
  const amtOf=r=>Math.max(0,Number(r&&r.payment&&r.payment.amount)||0);
  const accepted=regs.filter(r=>r&&r.status==='ACCEPTED');
  /* Only teams with a valid playerOwner and a paid entry fee are refundable. */
  const cand=accepted.map(r=>({r,owner:typeof r.playerOwner==='string'?r.playerOwner.trim():'',amt:amtOf(r)})).filter(x=>x.owner&&x.owner.indexOf('/')<0&&x.amt>0);
  const userSnaps=await Promise.all(cand.map(x=>cloudDb.collection('users').doc(x.owner).get()));
  const refunds=cand.filter((x,i)=>userSnaps[i].exists);
  if(refunds.length>490)throw Error('Too many teams to refund in a single batch.');
  const refundSet=new Set(refunds.map(x=>x.r));
  const skipped=accepted.filter(r=>!refundSet.has(r)&&amtOf(r)>0);
  const stamp=now();
  const newRegs=regs.map(r=>refundSet.has(r)?{...r,status:'REFUNDED',updatedAt:stamp}:r);
  const patch={status:'CANCELLED',registrationStatus:'CLOSED',updatedAt:FV.serverTimestamp()};
  if(refunds.length){
   const batch=cloudDb.batch();
   refunds.forEach(x=>{const wu=Math.min(x.amt,Math.max(0,Number(x.r&&x.r.payment&&x.r.payment.winningsUsed)||0));const ru={updatedAt:FV.serverTimestamp()};if(x.amt-wu>0)ru.walletBalance=FV.increment(x.amt-wu);if(wu>0)ru.winningsBalance=FV.increment(wu);batch.update(cloudDb.collection('users').doc(x.owner),ru)});
   batch.update(tourRef,{...patch,registrations:newRegs});
   await batch.commit();
  }else{
   await tourRef.update(patch);
  }
  t.status='CANCELLED';t.registrationStatus='CLOSED';t.updatedAt=now();t.registrations=newRegs;
  const total=refunds.reduce((a,x)=>a+x.amt,0);
  try{logEvent(`Tournament cancelled: ${t.name||id} · refunded ${refunds.length} team(s) · ₹${total}`)}catch(_){}
  if(refunds.some(x=>x.owner===currentUser.uid)&&typeof refreshCloudUser==='function')refreshCloudUser();
  closeModal();render();
  toast(refunds.length?'Tournament cancelled. Entry fees refunded to all accepted teams.':'Tournament cancelled.','success');
  if(skipped.length)toast('Not refunded (missing/invalid player account): '+skipped.map(r=>r.teamName||r.id).join(', '),'warning');
 }catch(ex){
  console.error('Cancel & refund failed:',ex);
  buttons.forEach(b=>b.disabled=false);
  toast('Could not cancel tournament: '+(ex.message||'error')+'. Nothing was refunded.','error');
 }finally{_cancelRefundBusy=false}
}

function toLocalInput(s){if(!s)return '';const d=new Date(s);if(isNaN(d))return '';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}

function dtField(name,iso){const v=toLocalInput(iso);let date='',h='',m='00',ap='PM';if(v){date=v.slice(0,10);const hh=+v.slice(11,13);ap=hh>=12?'PM':'AM';h=String(hh%12||12);m=v.slice(14,16)}
const hs='<option value="">HH</option>'+Array.from({length:12},(_,i)=>{const x=String(i+1);return `<option value="${x}" ${x===h?'selected':''}>${x}</option>`}).join('');
const ms=Array.from({length:60},(_,i)=>{const x=String(i).padStart(2,'0');return `<option value="${x}" ${x===m?'selected':''}>${x}</option>`}).join('');
const as=['AM','PM'].map(x=>`<option value="${x}" ${x===ap?'selected':''}>${x}</option>`).join('');
return `<div class="dtf" data-dt><input type="hidden" name="${name}" value="${v}"><input type="date" class="dtd" value="${date}" onchange="syncDT(this)"><div class="dtt"><select class="dth" onchange="syncDT(this)">${hs}</select><select class="dtm" onchange="syncDT(this)">${ms}</select><select class="dta" onchange="syncDT(this)">${as}</select></div></div>`}
function syncDT(el){const w=el.closest('[data-dt]');const g=c=>w.querySelector(c);const hid=g('input[type=hidden]');const date=g('.dtd').value;if(!date){hid.value='';return}
if(!g('.dth').value)g('.dth').value='12';let h=(+g('.dth').value)%12;if(g('.dta').value==='PM')h+=12;hid.value=date+'T'+String(h).padStart(2,'0')+':'+g('.dtm').value}
function saveTournamentEdit(e,id){e.preventDefault();const f=new FormData(e.target);const t=getT(id);const slots=Number(f.get('slots'));if(!Number.isInteger(slots)||slots<slotCount(t)||slots>1000){toast('Slots must be an integer and cannot be below current registrations.','error');return}const pp=prizeParse(f.getAll('prize'),f.get('prizePool'));if(pp.err){toast(pp.err,'error');return}const ok=mutate(()=>{t.prizePool=pp.pool;t.prizeDistribution=pp.dist;t.name=String(f.get('name')).trim();t.entryFee=Number(f.get('entryFee'));if(!isCustomTournament(t))t.slotStart=Math.max(1,Math.floor(Number(f.get('slotStart')))||DEFAULT_SLOT_START);t.slots=slots;t.registrationClosesAt=f.get('registrationClosesAt')?new Date(f.get('registrationClosesAt')).toISOString():'';t.startsAt=f.get('startsAt')?new Date(f.get('startsAt')).toISOString():'';t.rules=String(f.get('rules')).trim();t.updatedAt=now()},'Tournament updated');if(ok){closeModal();render()}}

function openRegisterModal(id){const t=getT(id);if(!t||!isOpen(t)){toast('Registration is not open.','warning');return}if(t.registrations.some(r=>r.playerOwner===state.profile.id&&!['REJECTED','REMOVED'].includes(r.status))){toast('You already have a registration for this tournament.','warning');return}const paid=Number(t.entryFee)>0;const basic=[['teamName','Team Name'],['captainName','Captain Name'],['captainId','Captain ID']].map(([n,l])=>`<div class="field"><label>${l} *</label><input name="${n}" required maxlength="70" ${n==='captainName'?`value="${esc(state.profile.displayName)}"`:n==='captainId'?`value="${esc(state.profile.bgmiId)}"`:''}></div>`).join('');const players=Array.from({length:4},(_,i)=>`<div class="field"><label>Player ${i+1} Name${i===0?' (Captain)':''} *</label><input name="player${i+1}Name" required maxlength="70" ${i===0?`value="${esc(state.profile.displayName)}"`:''}></div><div class="field"><label>Player ${i+1} ID *</label><input name="player${i+1}Id" required maxlength="50" ${i===0?`value="${esc(state.profile.bgmiId)}"`:''}></div>`).join('');const payment=paid?`<div class="card" style="background:#fff;color:#111;border:1px solid #ddd"><h3 style="color:#111">Payment Instructions</h3>${t.qrCode?`<img src="${esc(t.qrCode)}" alt="Organizer Payment QR" style="display:block;width:100%;max-width:300px;margin:10px auto;object-fit:contain;background:#fff">`:'<p>Organizer has not uploaded a QR code.</p>'}<div style="font-size:25px;font-weight:900;text-align:center;margin:12px 0">Pay ₹${esc(t.entryFee)}</div><p style="white-space:pre-wrap;color:#222">${esc(t.paymentRules||'Follow organizer instructions.')}</p></div><div class="field"><label>Payment Screenshot *</label><input type="file" accept="image/*" id="payment-screenshot" name="paymentScreenshot" required></div>`:'<div class="notice">Free entry — no payment required.</div>';openModal('Register Team',`<form id="team-registration-form" onsubmit="submitRegistration(event,'${id}')">${basic}<div class="field"><label>Team Logo *</label><label class="btn smallbtn" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center">📷 Choose logo<input type="file" accept="image/*" id="team-logo-file" name="teamLogoFile" hidden onchange="regLogoPreview(this)"></label><span id="team-logo-name" class="muted small" style="margin-left:8px"></span><img id="team-logo-prev" alt="" style="display:none;width:72px;height:72px;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid #4b3b5b"></div>${players}${payment}<div id="reg-general-error" class="field-error" role="alert"></div><button id="reg-submit" class="btn primary full" type="submit">Submit Registration</button><p class="hint">Payment screenshot will be verified by the organizer.</p></form>`)}
function previewRegistrationImage(input,previewId){const file=input.files&&input.files[0],preview=document.getElementById(previewId);if(!file){if(preview){preview.src='';preview.classList.add('hide')}clearRegError(input);return}if(!file.type.startsWith('image/')){setRegError(input,'Choose a valid image file.');input.value='';return}if(file.size>2*1024*1024){setRegError(input,'Image must be 2 MB or smaller.');input.value='';return}const reader=new FileReader();reader.onload=()=>{if(preview){preview.src=reader.result;preview.classList.remove('hide')}clearRegError(input)};reader.onerror=()=>setRegError(input,'Could not read this image. Please choose it again.');reader.readAsDataURL(file)}
function setRegError(el,msg){if(!el)return;el.classList.add('invalid');const e=document.getElementById('err-'+el.name);if(e)e.textContent=msg}
function clearRegError(el){if(!el)return;el.classList.remove('invalid');const e=document.getElementById('err-'+el.name);if(e)e.textContent='';const general=document.getElementById('reg-general-error');if(general)general.textContent=''}
function readRegFile(file){return new Promise((resolve,reject)=>{if(!file||!_atariIsImg(file))return reject(Error('Choose a valid image file.'));if(file.size>10*1024*1024)return reject(Error('Image is too large (max 10 MB).'));const raw=()=>{try{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(Error('Could not read image file.'));r.readAsDataURL(file)}catch(err){reject(Error('Could not read image file.'))}};try{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const max=900;let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)throw Error('empty image');const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const out=c.toDataURL('image/jpeg',0.8);URL.revokeObjectURL(url);if(!out||out.length<30)throw Error('empty canvas');resolve(out)}catch(e){try{URL.revokeObjectURL(url)}catch(_){}raw()}};img.onerror=()=>{try{URL.revokeObjectURL(url)}catch(_){}raw()};img.src=url}catch(e){raw()}})}
function regLogoPreview(inp){const f=inp.files&&inp.files[0];const n=document.getElementById('team-logo-name'),im=document.getElementById('team-logo-prev');if(!f){if(n)n.textContent='';if(im)im.style.display='none';return}if(n)n.textContent=f.name;if(im){im.src=URL.createObjectURL(f);im.style.display='block'}}
/* ===== Match modes, tournament sorting and registration auto-fill helpers ===== */
const MATCH_MODE_SIZE={'BR':4,'Squad':4,'Duo':2,'Solo':1,'1v1':1,'2v2':2,'3v3':3,'4v4':4,'6v6':6,'8v8':8,'TDM':4,'Inventory Room':1,'Wow Mod':4};
/* Step 2 "Select Game Mode" buttons: [label shown and saved as mode, matchType, teamSize] */
const GAME_MODES=[['Battle Royale (Classic)','BR',4],['Team Deathmatch (TDM)','TDM',4],['1v1','1v1',1],['2v2','2v2',2],['3v3','3v3',3],['4v4','4v4',4],['6v6','6v6',6],['8v8','8v8',8],['Inventory Room','Inventory Room',1],['Wow Mod','Wow Mod',4]];
/* Map for custom tournaments: Inventory Room -> "Inventory Room", Wow Mod -> its custom code. null for Battle Royale / legacy. */
function customMapFor(t){if(!t)return null;if(t.mode==='Inventory Room'||t.matchType==='Inventory Room')return 'Inventory Room';if(t.mode==='Wow Mod'||t.matchType==='Wow Mod')return String(t.customModCode||t.customMapCode||'').trim()||'Wow Mod';return null}
function modeDisplay(t){return t&&CUSTOM_ROOM_MODES.includes(t.mode)?t.mode+' ('+matchLabel(t)+')':(t&&t.mode)||''}
function matchLabel(t){const m=(t&&(t.matchType||t.squadType))||'';return m==='BR'?((t&&t.squadType)||'BR'):m}
/* ===== AI Setup wizard: smart step flow =====
   BR keeps every original step. Custom modes skip Maps (3), Point System (6) and Custom Points (7).
   Step 2.5 = Wow Mod custom map code (only for Wow Mod, asked right after mode selection). */
function wizardIsBR(a){return !a.mode||a.mode==='Battle Royale (Classic)'}
function wizardTeamSizes(mode){return mode==='Wow Mod'?['1v1','2v2','3v3','4v4','5v5','6v6','7v7','8v8']:['1v1','2v2','3v3','4v4']}
/* Custom modes (Inventory Room / Wow Mod) use a short flow: Name > Mode > Team Size (2.2) > Team Slots (2.3) > Map Code (2.5, Wow Mod only) > Entry Fee > Banner > Review */
function wizardSkipStep(step,a){
  if(wizardIsBR(a))return step===2.2||step===2.3||step===2.5;
  if(step===2.2||step===2.3)return false;
  if(step===2.5)return a.mode!=='Wow Mod';
  return [3,4,5,6,7,8,9,10,13].indexOf(step)>=0;
}
const WIZARD_STEPS=[1,2,2.2,2.3,2.5,3,4,5,6,7,8,9,10,11,11.5,12,13,14];
function wizardPath(a){return WIZARD_STEPS.filter(x=>!wizardSkipStep(x,a))}
function wizardNextStep(step,a){return wizardPath(a).find(x=>x>step)||14}
function wizardPrevStep(step,a){const p=wizardPath(a).filter(x=>x<step);return p.length?p[p.length-1]:1}
function wizardProgress(w){const p=wizardPath(w.answers),i=p.indexOf(w.step);return [i>=0?i+1:Math.min(p.length,Math.max(1,p.filter(x=>x<=w.step).length)),p.length]}
/* Players per team for the registration form. Tournaments created before match modes existed (no matchType) keep the original 4 player fields. */
function matchTeamSize(t){if(!t||!t.matchType)return 4;const n=Number(t.teamSize);if(Number.isInteger(n)&&n>=1&&n<=8)return n;return MATCH_MODE_SIZE[t.matchType]||4}
function getSortedTournaments(){const ms=t=>{const v=t&&(t.createdAt||t.updatedAt);if(!v)return 0;if(typeof v==='object'&&typeof v.seconds==='number')return v.seconds*1000;const n=typeof v==='number'?v:Date.parse(v);return Number.isFinite(n)?n:0};return (state.tournaments||[]).map((t,i)=>[t,i]).sort((x,y)=>(ms(y[0])-ms(x[0]))||(x[1]-y[1])).map(x=>x[0])}
function _atariLastTeamFromRegs(uid){
  const ms=v=>{if(!v)return 0;if(typeof v==='object'&&typeof v.seconds==='number')return v.seconds*1000;const n=typeof v==='number'?v:Date.parse(v);return Number.isFinite(n)?n:0};
  const regs=(state.tournaments||[]).flatMap(t=>(t.registrations||[]).filter(r=>r&&r.playerOwner===uid&&Array.isArray(r.players)&&r.players.length));
  if(!regs.length)return null;
  regs.sort((x,y)=>ms(y.createdAt)-ms(x.createdAt));
  const r=regs[0];
  return {teamName:r.teamName||'',captainName:r.captainName||'',captainId:r.captainId||'',city:r.city||'',logo:r.logo||r.teamLogo||'',players:r.players.slice(0,8).map(x=>({name:x.name||'',id:x.id||x.playerId||''}))};
}
async function _atariGetLastTeam(){
  if(!currentUser||!cloudDb)return null;
  const uid=currentUser.uid,c=window._atariLastTeamCache;
  if(c&&c.uid===uid&&c.data)return c.data;
  let d=null;
  try{const snap=await cloudDb.collection('users').doc(uid).get();d=snap.exists?(snap.data().lastTeamData||null):null}catch(e){console.warn('Could not load last team data',e)}
  if(!d)d=_atariLastTeamFromRegs(uid); /* no saved copy yet (e.g. registered before this feature): use the previous registration */
  if(d)window._atariLastTeamCache={uid,data:d};
  return d;
}
async function _atariSaveLastTeam(reg,logo){
  try{
    if(!currentUser||!cloudDb)return;
    const prev=await _atariGetLastTeam();
    const players=(reg.players||[]).slice(0,8).map(x=>({name:x.name,id:x.id}));
    /* A smaller mode (e.g. 1v1) must not wipe the roster saved from a bigger one: keep the remaining previous players. */
    if(prev&&Array.isArray(prev.players))for(let i=players.length;i<Math.min(prev.players.length,8);i++){const q=prev.players[i]||{};players.push({name:q.name||'',id:q.id||q.playerId||''})}
    const d={teamName:reg.teamName,captainName:reg.captainName,captainId:reg.captainId,city:reg.city||'',players};
    if(typeof logo==='string'&&logo&&logo.length<=150000)d.logo=logo;
    window._atariLastTeamCache={uid:currentUser.uid,data:d};
    await cloudDb.collection('users').doc(currentUser.uid).set({lastTeamData:d},{merge:true});
  }catch(e){console.warn('Could not save last team data',e)}
}
async function _regPrefill(){
  const form=document.getElementById('team-registration-form');if(!form)return;
  form.addEventListener('input',e=>{if(e.target&&e.target.dataset)e.target.dataset.touched='1'});
  const d=await _atariGetLastTeam();
  if(!d||document.getElementById('team-registration-form')!==form)return;
  const set=(n,v)=>{const el=form.elements[n];if(el&&v&&!el.dataset.touched)el.value=String(v)};
  set('teamName',d.teamName);set('captainName',d.captainName);set('captainId',d.captainId);set('city',d.city);
  (Array.isArray(d.players)?d.players:[]).slice(0,8).forEach((p,i)=>{set('player'+(i+1)+'Name',p&&p.name);set('player'+(i+1)+'Id',p&&(p.id||p.playerId))});
  const lf=form.elements.teamLogoFile;
  const savedLogo=d.logo||d.teamLogo||'';
  if(savedLogo&&lf&&!(lf.files&&lf.files[0])){window._regLastLogo=savedLogo;const n=document.getElementById('team-logo-name'),im=document.getElementById('team-logo-prev');if(n)n.textContent='Last used logo';if(im){im.src=savedLogo;im.style.display='block'}}
  if(d.teamName){const note=document.getElementById('reg-prefill-note');if(note)note.style.display=''}
}

function safeIso(v){if(!v)return'';if(typeof v==='string')return v;if(typeof v.toDate==='function'){try{return v.toDate().toISOString()}catch(e){return''}}if(typeof v.seconds==='number')return new Date(v.seconds*1000).toISOString();return''}

function globalLeaderboardData(){const cur=new Date().toISOString().slice(0,7),monthly=ui.leaderboardMonth==='Current month';const map=new Map();(liveTournaments||state.tournaments||[]).forEach(t=>{const regs=t.registrations||[];const ms=(t.matches||[]).filter(m=>{if(!monthly)return true;const d=safeIso(m.completedAt||m.updatedAt||m.date||m.startsAt||t.updatedAt||t.createdAt);return !d||d.slice(0,7)===cur});calcStandings({...t,matches:ms}).forEach(s=>{const key=String(s.teamName).trim().toLowerCase();const reg=regs.find(r=>r.id===s.teamId||String(r.teamName||'').trim().toLowerCase()===key);const e=map.get(key)||{id:s.teamId,name:s.teamName,points:0,matches:0,kills:0,city:''};e.points+=s.total;e.matches+=s.matches;e.kills+=s.kills;if(reg&&reg.city)e.city=String(reg.city).trim();map.set(key,e)})});let teams=[...map.values()];const c=String(ui.leaderboardCity||'').toLowerCase();if(c)teams=teams.filter(x=>String(x.city||'').toLowerCase()===c);teams.sort((a,b)=>b.points-a.points||b.kills-a.kills||a.matches-b.matches||a.name.localeCompare(b.name));return teams.map((t,i)=>({...t,rank:i+1}))}

function profilePhotoUpload(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(!_atariIsImg(file)){toast('Choose an image file.','error');return}if(file.size>10*1024*1024){toast('Image must be 10 MB or smaller.','error');return}const saveAvatar=async d=>{try{if(typeof cloudDb!=='undefined'&&cloudDb&&currentUser){await cloudDb.collection('users').doc(currentUser.uid).set({avatar:d,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}state.profile.avatar=d;toast('Profile photo updated.','success');render()}catch(ex){toast(ex.message||'Could not save photo.','error')}};let fell=false;const fallback=()=>{if(fell)return;fell=true;_atariRawDataUrl(file).then(saveAvatar).catch(()=>toast('Could not read this image.','error'))};try{const rd=new FileReader();rd.onerror=fallback;rd.onload=()=>{try{const img=new Image();img.onerror=fallback;img.onload=()=>{let d;try{const c=document.createElement('canvas');c.width=c.height=256;const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,m=Math.min(w,h);if(!m)throw Error('empty image');c.getContext('2d').drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,256,256);d=c.toDataURL('image/jpeg',.8);if(!d||d.length<30)throw Error('empty canvas')}catch(err){fallback();return}if(!fell){fell=true;saveAvatar(d)}};img.src=rd.result}catch(err){fallback()}};rd.readAsDataURL(file)}catch(err){fallback()}e.target.value=''}
function setTournamentBanner(tid,e){const file=e.target.files&&e.target.files[0];if(!file)return;if(!_atariIsImg(file)){toast('Choose an image file.','error');return}if(file.size>10*1024*1024){toast('Image must be 10 MB or smaller.','error');return}const saveBanner=d=>{if(mutate(()=>{const t=getT(tid);t.banner=d;t.updatedAt=now()},'Tournament post updated'))render()};let fell=false;const fallback=()=>{if(fell)return;fell=true;_atariRawDataUrl(file).then(saveBanner).catch(()=>toast('Could not read this image.','error'))};try{const rd=new FileReader();rd.onerror=fallback;rd.onload=()=>{try{const img=new Image();img.onerror=fallback;img.onload=()=>{let d;try{const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)throw Error('empty image');const c=document.createElement('canvas');const sc=Math.min(1,1200/iw,600/ih);c.width=Math.max(1,Math.round(iw*sc));c.height=Math.max(1,Math.round(ih*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',.78);if(!d||d.length<30)throw Error('empty canvas')}catch(err){fallback();return}if(!fell){fell=true;saveBanner(d)}};img.src=rd.result}catch(err){fallback()}};rd.readAsDataURL(file)}catch(err){fallback()}}

function withTimeout(promise,ms){return Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(Error('Request timed out. Check your internet connection and try again.')),ms))])}
function _atariRawDataUrl(file){return new Promise((res,rej)=>{try{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(Error('Could not read the image.'));r.readAsDataURL(file)}catch(err){rej(Error('Could not read the image.'))}})}
function _atariIsImg(file){const t=String((file&&file.type)||''),n=String((file&&file.name)||'');return t.startsWith('image/')||(!t&&/\.(jpe?g|png|webp|gif|bmp|heic|heif|avif|tiff?)$/i.test(n))}
function _atariImgReject(file){if(!file)return null;if(Number(file.size)>10*1024*1024)return 'Image must be 10 MB or smaller.';if(!_atariIsImg(file))return 'Only image files are allowed.';return null}
function compressImageFile(file,max,q){return new Promise((res,rej)=>{const _bad=_atariImgReject(file);if(_bad){rej(Error(_bad));return}let settled=false,timer=null;const done=v=>{if(settled)return;settled=true;clearTimeout(timer);res(v)};const fail=m=>{if(settled)return;settled=true;clearTimeout(timer);rej(Error(m||'Could not read the image.'))};const fallbackToRaw=()=>{if(settled)return;try{const fr=new FileReader();fr.onload=()=>done(String(fr.result));fr.onerror=()=>fail('Could not read the image.');fr.readAsDataURL(file)}catch(err){fail('Could not read the image.')}};const draw=(img)=>{const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)throw Error('empty image');const sc=Math.min(1,max/iw,max/ih);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(iw*sc));c.height=Math.max(1,Math.round(ih*sc));const x=c.getContext('2d');x.fillStyle='#1a1521';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);const out=c.toDataURL('image/jpeg',q);if(!out||out.length<30)throw Error('empty canvas');return out};try{const rd=new FileReader();rd.onerror=()=>fallbackToRaw();rd.onload=()=>{try{const img=new Image();img.onerror=()=>fallbackToRaw();img.onload=()=>{try{done(draw(img))}catch(err){fallbackToRaw()}};img.src=rd.result}catch(err){fallbackToRaw()}};timer=setTimeout(fallbackToRaw,20000);rd.readAsDataURL(file)}catch(err){fallbackToRaw()}})}
function startLiveLeaderboard(){try{if(liveUnsub)liveUnsub();liveUnsub=cloudDb.collection('tournaments').onSnapshot(snap=>{liveTournaments=snap.docs.map(d=>{const x=d.data();return {...x,id:d.id,registrations:Array.isArray(x.registrations)?x.registrations:[],matches:Array.isArray(x.matches)?x.matches:[]}});const sig=JSON.stringify(globalLeaderboardData().slice(0,50).map(t=>[t.name,t.points,t.city]));const m=document.getElementById('modal-root');const open=m&&m.innerHTML.trim()!=='';const bookedChanged=syncBookedOverridesFromSnapshot(snap);if(sig!==lbSig){lbSig=sig;if(!open&&['leaderboard','home'].includes(ui.page))render()}else if(bookedChanged&&!open&&(['home','battle','tournaments','inn'].includes(ui.page)||((ui.page==='tournament-detail'||ui.page==='organizer-detail')&&ui.detailTab==='Overview')))render()},err=>console.error('Live leaderboard error',err))}catch(e){console.error(e)}}

function renderProfile(){const p=state.profile;const registrations=state.tournaments.flatMap(t=>t.registrations.filter(r=>r.playerOwner===p.id).map(r=>({r,t})));return `<div class="row"><label style="cursor:pointer;position:relative;display:inline-block">${profileAvatarHtml(p,60)}<span style="position:absolute;right:-4px;bottom:-4px;background:var(--accent);color:#1d1524;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px">📷</span><input type="file" accept="image/*" hidden onchange="profilePhotoUpload(event)"></label><div><div class="eyebrow">PLAYER PROFILE</div><h1>${esc(p.displayName)}</h1><p class="muted small">${p.bgmiId?'BGMI ID linked':'BGMI ID not linked'}</p></div></div><div class="card section"><h2>Profile details</h2><div class="row" style="margin-bottom:14px">${profileAvatarHtml(p,72)}<label class="btn smallbtn" style="cursor:pointer">Change photo<input type="file" accept="image/*" hidden onchange="profilePhotoUpload(event)"></label></div><form onsubmit="saveProfile(event)"><div class="field"><label>Display name</label><input name="displayName" maxlength="40" required value="${esc(p.displayName)}"></div><div class="field"><label>City</label><input name="city" list="india-cities" maxlength="40" placeholder="Type to search city" autocomplete="off" value="${esc(p.city||'')}"><datalist id="india-cities">${INDIA_CITIES.map(c=>`<option value="${c}">`).join('')}</datalist></div><button class="btn primary">Save profile</button></form><div class="divider"></div><div class="row between"><div><strong>BGMI ID</strong><p class="muted small">${p.bgmiId?esc(p.bgmiName)+' · '+esc(p.bgmiId):'Not linked'}</p></div><button class="btn smallbtn" onclick="openBgmiModal()">${p.bgmiId?'Edit':'Link'}</button></div></div><div class="section"><h2>Your registrations</h2>${registrations.length?registrations.map(({r,t})=>`<div class="card row between"><div class="grow"><strong>${esc(r.teamName)}</strong><div class="muted small">${esc(t.name)}</div></div>${badge(r.status)}</div>`):empty('No registrations yet','Your team registrations will be listed here.')}</div>`}
function saveProfile(e){e.preventDefault();const name=String(new FormData(e.target).get('displayName')).trim();if(!name){toast('Display name is required.','error');return}if(mutate(()=>state.profile.displayName=name,'Profile updated'))render()}
function resetDemoIdentity(){openModal('Reset player identity?',`<p class="muted">This resets the local player profile and saved tournaments list. Tournament records and results remain.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="mutate(()=>{state.profile={id:'local-player',displayName:'Player One',bgmiName:'',bgmiId:'',avatar:''};state.savedTournamentIds=[]},'Player identity reset');closeModal();render()">Reset identity</button></div>`)}
function renderSettings(){const p=state.preferences;return `<div class="eyebrow">ORGANIZER TOOLS</div><h1>Settings</h1><p class="sub">Manage your tournament defaults.</p><div class="card"><h2>Organizer profile</h2><form onsubmit="saveOrganizer(event)"><div class="field"><label>Display name</label><input name="displayName" maxlength="40" required value="${esc(state.organizer.displayName)}"></div><button class="btn primary">Save organizer profile</button></form></div><div class="card"><h2>Organizer Payment QR</h2><p class="muted small">Upload the UPI QR image used by paid tournament registrations. This is saved in the same app LocalStorage state.</p><form onsubmit="saveOrganizerQr(event)"><div class="field"><label for="organizer-upi-qr">UPI QR image</label><input id="organizer-upi-qr" name="upiQr" type="file" accept="image/*"><small class="hint">Image file up to 2 MB.</small></div>${state.organizer.upiQr?`<img class="file-preview" src="${esc(state.organizer.upiQr)}" alt="Saved organizer UPI QR"><button class="btn danger smallbtn" type="button" onclick="clearOrganizerQr()">Remove QR</button>`:`<p class="muted small">Payment QR not configured by organizer.</p>`}<button class="btn primary full">Save Payment QR</button></form></div><div class="card"><h2>Tournament defaults</h2><form onsubmit="savePreferences(event)"><div class="field"><label>Default point system</label><select name="defaultPointSystem"><option ${p.defaultPointSystem==='Custom Points'?'selected':''}>Custom Points</option><option ${p.defaultPointSystem==='Standard BGMI Points'?'selected':''}>Standard BGMI Points</option><option ${p.defaultPointSystem==='Super Points (BGIS)'?'selected':''}>Super Points (BGIS)</option></select></div><div class="field"><label>Default kill points</label><input name="defaultKillPoints" type="number" min="0" max="100" step="1" required value="${p.defaultKillPoints}"></div><div class="field"><label>Default squad type</label><select name="defaultSquadType"><option ${p.defaultSquadType==='Squad'?'selected':''}>Squad</option><option ${p.defaultSquadType==='Duo'?'selected':''}>Duo</option><option ${p.defaultSquadType==='Solo'?'selected':''}>Solo</option></select></div><label class="inline-check"><input type="checkbox" name="allowPartialSquads" ${p.allowPartialSquads?'checked':''}> Allow partial squads by default</label><button class="btn primary">Save defaults</button></form></div><div class="card"><h2>Data management</h2><p class="muted small">Export or restore tournaments, registrations, match information, results, and preferences.</p><div class="actions"><button class="btn primary" onclick="exportData()">Export JSON</button><button class="btn" onclick="document.getElementById('import-file').click()">Import JSON</button></div><div class="divider"></div><button class="btn danger full" onclick="confirmResetData()">Reset all local data</button></div>`}
function saveOrganizer(e){e.preventDefault();const name=String(new FormData(e.target).get('displayName')).trim();if(!name)return;if(mutate(()=>state.organizer.displayName=name,'Organizer profile saved'))render()}
function saveOrganizerQr(e){e.preventDefault();const input=document.getElementById('organizer-upi-qr'),file=input&&input.files&&input.files[0];if(!file){toast('Choose a QR image first.','error');return}if(!file.type.startsWith('image/')||file.size>2*1024*1024){toast('Choose a valid image up to 2 MB.','error');return}const reader=new FileReader();reader.onerror=()=>toast('Could not read QR image.','error');reader.onload=()=>{const old=JSON.stringify(state);state.organizer.upiQr=String(reader.result);if(saveAppState()){toast('Organizer payment QR saved.','success');render()}else state=normalizeState(JSON.parse(old))};reader.readAsDataURL(file)}
function clearOrganizerQr(){const old=JSON.stringify(state);delete state.organizer.upiQr;if(saveAppState()){toast('Organizer payment QR removed.','success');render()}else state=normalizeState(JSON.parse(old))}
function savePreferences(e){e.preventDefault();const f=new FormData(e.target);const kp=Number(f.get('defaultKillPoints'));if(!Number.isInteger(kp)||kp<0||kp>100){toast('Kill points must be a whole number from 0 to 100.','error');return}if(mutate(()=>state.preferences={...state.preferences,defaultPointSystem:f.get('defaultPointSystem'),defaultKillPoints:kp,defaultSquadType:f.get('defaultSquadType'),allowPartialSquads:f.get('allowPartialSquads')==='on'},'Defaults saved'))render()}
function exportData(){try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='atari-esports-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON backup exported.','success')}catch(e){toast('Export failed.','error')}}
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const raw=JSON.parse(await file.text());const candidate=normalizeState(raw);openModal('Import backup?',`<p class="muted">This backup contains ${candidate.tournaments.length} tournaments. Importing replaces current local data. Export your current data first if needed.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyImportedState(${JSON.stringify(JSON.stringify(candidate)).replace(/</g,'\\u003c')})">Import and replace</button></div>`)}catch(err){toast('Invalid JSON backup. Existing data was not changed.','error')}e.target.value=''});
function applyImportedState(serialized){try{const candidate=normalizeState(JSON.parse(serialized));const old=state;state=candidate;if(!saveAppState()){state=old;return}closeModal();toast('Backup imported.','success');render()}catch(e){toast('Import failed; existing data was preserved.','error')}}
function confirmResetData(){openModal('Reset all local data?',`<p class="muted">This permanently removes the Atari Esports data stored in this browser, including tournaments, registrations, chat and results. It does not delete any server-side records.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="state=sampleState();ui={...ui,role:'player',page:'home',selectedTournamentId:null,detailTab:'Overview',wizard:null};if(saveAppState()){closeModal();toast('Local data reset.','success');render()}">Reset local data</button></div>`)}
function openModal(title,body){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2 style="margin:0">${esc(title)}</h2><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div>${body}</section></div>`;const first=root.querySelector('input,button,select,textarea');if(first)first.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function promptOrganizerAccess(){if(!isAdminEmail()){toast('Access Denied. Only the Admin can access this panel.','error');ui.role='player';state.currentRole='player';ui.page='home';render();return}ui.role='organizer';state.currentRole='organizer';ui.page='home';render();toast('Organizer access granted.','success')}
/* verifyAdminCode removed: organizer access is checked against ADMIN_EMAIL */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(ui.wizard&&ui.page==='setup'&&ui.wizard.typing){clearTimeout(ui.wizardTimer);ui.wizard.typing=false;render()}}});

function startWizard(){ui.wizard={step:1,answers:{name:'',mode:'Battle Royale (Classic)',maps:['Erangel'],perspective:'TPP',squadType:'Squad',matchType:'BR',teamSize:4,customModCode:'',customMapCode:'',pointSystem:'Custom Points',scoringConfig:DEFAULT_POINTS.map(x=>({...x})),pointsPerKill:1,slots:72,allowPartialSquads:false,stageFormat:'Qualification',entryFee:0,prizePool:0,prizeDraft:['','',''],prizeDistribution:[],qrCode:'',paymentRules:'',banner:''},history:[],typing:false,launched:false};ui.page='setup';render();wizardAskCurrent()}
function wizardStepData(step){return {1:['Let’s set up your tournament! What do you want to call it?','name'],2:['Select Game Mode','mode'],3:['Select Maps','maps'],4:['Select Perspective','perspective'],5:['Select Squad Type','squadType'],6:['Select Point System','pointSystem'],7:['Let’s set up Custom Points for each position. Remember, 1 Kill = 1 Point.','scoringConfig'],8:['How many slots would you like?','slots'],9:['Allow partial squads to play?','allowPartialSquads'],10:['Select Stage Format','stageFormat'],11:['What is the entry fee? (Enter 0 for Free).','entryFee'],12:['Upload your Payment QR Code Image.','qrCode'],13:['Enter payment instructions or rules.','paymentRules'],14:['Upload a Banner Image for your tournament.','banner'],15:['Review your tournament setup and launch when ready.','review']}[step]||['Review your tournament setup.','review']}
function wizardAskCurrent(){const w=ui.wizard;if(!w)return;const data=wizardStepData(w.step);if(!w.history.some(x=>x.step===w.step&&x.bot)){w.history.push({step:w.step,bot:data[0]})}w.typing=true;render();clearTimeout(ui.wizardTimer);ui.wizardTimer=setTimeout(()=>{if(!ui.wizard)return;ui.wizard.typing=false;render()},1200)}
function scrollWizard(){const el=document.getElementById('wizard-chat');if(el)el.scrollTop=el.scrollHeight}
function renderWizard(){const w=ui.wizard;if(!w)return `<div class="eyebrow">AI SETUP</div><h1>Tournament assistant</h1><p class="sub">Build a tournament step by step.</p><button class="btn primary full" onclick="startWizard()">Start new setup</button>`;const a=w.answers;return `<div class="row between"><div><div class="eyebrow">ORGANIZER · SETUP ${wizardProgress(w)[0]}/${wizardProgress(w)[1]}</div><h1>AI Tournament Setup</h1></div><button class="btn ghost smallbtn" onclick="cancelWizard()">Cancel</button></div><div style="height:5px;background:#40334f;border-radius:6px;margin:12px 0 4px"><div style="height:5px;width:${wizardProgress(w)[0]/wizardProgress(w)[1]*100}%;background:var(--accent);border-radius:6px"></div></div><div class="wizard-chat card" id="wizard-chat">${w.history.filter(x=>x.step<=w.step&&!wizardSkipStep(x.step,a)).map(x=>`<div class="bubble">${esc(x.bot)}</div>${x.user?`<div class="bubble user">${esc(x.user)}</div>`:''}`).join('')}${w.typing?'<div class="bubble typing" aria-label="Typing"><i></i><i></i><i></i></div>':''}</div>${w.typing?'<div class="hint">Atari assistant is typing…</div>':renderWizardControls()}<div class="actions" style="margin-top:14px"><button class="btn" onclick="wizardBack()" ${w.step===1?'disabled':''}>← Back</button><button class="btn ghost" onclick="cancelWizard()">Cancel setup</button></div>`}
function renderWizardControls(){const w=ui.wizard,a=w.answers;switch(w.step){case 1:return `<form onsubmit="wizardSubmitName(event)"><div class="field"><label>Tournament name</label><input name="name" maxlength="70" required placeholder="e.g. Atari Championship Series" value="${esc(a.name)}"></div><button class="btn primary full">Continue →</button></form>`;case 2:return `<div class="wizard-options">${GAME_MODES.map(([x])=>`<button class="option ${a.mode===x?'selected':''}" onclick="wizardChooseMode('${x}')">${x}</button>`).join('')}</div>`;case 3:return `<div class="map-grid">${MAPS.map(x=>`<button class="map-option ${a.maps.includes(x)?'selected':''}" onclick="wizardToggleMap('${x}')">▧ ${x}<small>${a.maps.includes(x)?'✓ Selected':'Tap to select'}</small></button>`).join('')}</div><button class="btn primary full" onclick="wizardConfirmMaps()">Confirm Maps (${a.maps.length})</button>`;case 4:return `<div class="wizard-options">${['TPP','FPP'].map(x=>`<button class="option ${a.perspective===x?'selected':''}" onclick="wizardChoose('perspective','${x}')">${x==='TPP'?'Third Person (TPP)':'First Person (FPP)'}</button>`).join('')}</div>`;case 5:return `<div class="wizard-options">${[['Squad','Squad (4 players)'],['Duo','Duo (2 players)'],['Solo','Solo (1 player)']].map(([x,l])=>`<button class="option ${a.squadType===x?'selected':''}" onclick="wizardChoose('squadType','${x}')">${l}</button>`).join('')}</div>`;case 6:return `<div class="wizard-options">${['Standard BGMI Points','Super Points (BGIS)','Custom Points'].map(x=>`<button class="option ${a.pointSystem===x?'selected':''}" onclick="wizardChoose('pointSystem','${x}')">${x}</button>`).join('')}</div><p class="hint">Named scoring presets use configurable defaults.</p>`;case 7:return `<p class="hint">Placement points + finish points.</p><div class="field"><label>Points per kill</label><input type="number" min="0" max="100" step="1" value="${a.pointsPerKill}" onchange="wizardSetKillPoints(this.value)"></div><div id="points-editor">${a.scoringConfig.slice().sort((x,y)=>x.position-y.position).map(x=>`<div class="position-row"><label>Position #${x.position}</label><input type="number" min="0" step="1" value="${x.points}" onchange="wizardEditPoint(${x.position},this.value)"><button class="btn danger smallbtn" onclick="wizardDeletePoint(${x.position})">×</button></div>`).join('')}</div><button class="btn full" onclick="wizardAddPoint()">＋ Add Position</button><button class="btn primary full" style="margin-top:10px" onclick="wizardConfirmPoints()">Confirm Points →</button>`;case 8:return `<form onsubmit="wizardSubmitSlots(event)"><div class="field"><label>Team slots</label><input name="slots" type="number" min="1" max="1000" required value="${a.slots}"></div><button class="btn primary full">Continue →</button></form>`;case 9:return `<div class="wizard-options"><button class="option ${a.allowPartialSquads?'selected':''}" onclick="wizardChoose('allowPartialSquads',true)">Yes, allow partial squads</button><button class="option ${!a.allowPartialSquads?'selected':''}" onclick="wizardChoose('allowPartialSquads',false)">No, full team required</button></div>`;case 10:return `<div class="wizard-options">${['Single Match','Qualification','Group','Elimination','Semi-finals','Finals'].map(x=>`<button class="option ${a.stageFormat===x?'selected':''}" onclick="wizardChoose('stageFormat','${x}')">${x}</button>`).join('')}</div>`;case 11:return `<form onsubmit="wizardSubmitEntryFee(event)"><div class="field"><label>Entry Fee (₹)</label><input name="entryFee" type="number" min="0" step="1" required value="${Number(a.entryFee)||0}"></div><button class="btn primary full">Continue →</button></form>`;case 12:return `<div class="field"><label>Upload your Payment QR Code Image</label><input type="file" id="wizard-qr-file" accept="image/*" onchange="wizardQrUpload(event)"></div>${a.qrCode?`<img class="file-preview" src="${a.qrCode}" alt="Payment QR preview"><button class="btn danger full" onclick="wizardRemoveQr()">Remove QR Code</button>`:'<p class="hint">Required for paid tournaments. You may skip for free entry.</p>'}<button class="btn primary full" onclick="wizardContinueQr()">Continue →</button>`;case 13:return `<form onsubmit="wizardSubmitPaymentRules(event)"><div class="field"><label>Payment instructions or rules</label><textarea name="paymentRules" rows="4" placeholder="Enter UPI/payment instructions...">${esc(a.paymentRules||'')}</textarea></div><button class="btn primary full">Continue →</button></form>`;case 14:return `<div class="field"><label>Banner image (optional)</label><input type="file" id="banner-file" accept="image/*" onchange="wizardBannerUpload(event)"></div>${a.banner?`<img class="file-preview" src="${a.banner}" alt="Tournament banner preview"><div class="actions"><button class="btn" onclick="document.getElementById('banner-file').click()">Change Image</button><button class="btn danger" onclick="wizardRemoveBanner()">Remove Image</button></div>`:'<div class="tourney-banner"><strong>ATARI ESPORTS</strong></div><p class="hint">Optional tournament banner.</p>'}<button class="btn primary full" onclick="wizardContinueBanner()">Continue →</button>`;case 15:return `<div class="card"><div class="tourney-banner" style="${a.banner?`background-image:linear-gradient(0deg,#120e17bb,#120e1730),url('${a.banner}')`:''}"><strong>${esc(a.name||'Tournament banner')}</strong></div>${[['Tournament name',a.name],['Game','BGMI'],['Game mode',a.mode],['Maps',a.maps.join(', ')],['Perspective',a.perspective],['Squad type',a.squadType],['Point system',a.pointSystem],['Points per kill',a.pointsPerKill],['Total slots',a.slots],['Partial squads',a.allowPartialSquads?'Allowed':'Not allowed'],['Stage format',a.stageFormat],['Entry Fee',Number(a.entryFee)>0?'₹'+a.entryFee:'Free'],['Payment Rules',a.paymentRules||'Not specified']].map(([x,y])=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${esc(x)}</span><strong class="right">${esc(y)}</strong></div>`).join('')}${a.qrCode?`<img class="file-preview" src="${a.qrCode}" alt="Uploaded payment QR">`:'<p class="hint">No payment QR uploaded.</p>'}${a.pointSystem==='Custom Points'?`<p class="hint">Custom points: ${a.scoringConfig.slice().sort((x,y)=>x.position-y.position).map(x=>`#${x.position}=${x.points}`).join(' · ')}</p>`:''}</div><div class="actions"><button class="btn" onclick="wizardBack()">Back to Edit</button><button class="btn danger" onclick="cancelWizard()">Cancel</button></div><button class="btn primary full" style="margin-top:10px" onclick="createTournamentFromWizard()">✓ Create Quick Tournament</button>`;default:return ''}}
function wizardRecordUser(text){const w=ui.wizard;if(!w)return;const x=[...w.history].reverse().find(x=>x.step===w.step&&x.bot);if(x)x.user=text}
function wizardSubmitName(e){e.preventDefault();const name=String(new FormData(e.target).get('name')||'').trim();if(!name||name.length>70){toast('Enter a tournament name up to 70 characters.','error');return}wizardRecordUser(name);ui.wizard.answers.name=name;wizardNext()}
function wizardChoose(key,value){const w=ui.wizard;if(!w)return;const label=typeof value==='boolean'?(value?'Yes':'No'):String(value);wizardRecordUser(label);w.answers[key]=value;if(key==='squadType')w.answers.teamSize=value==='Squad'?4:value==='Duo'?2:1;if(key==='pointSystem'){if(value==='Custom Points'){wizardNext();return}if(value==='Standard BGMI Points')w.answers.scoringConfig=[{position:1,points:10},{position:2,points:6},{position:3,points:5},{position:4,points:4},{position:5,points:3},{position:6,points:2},{position:7,points:1},{position:8,points:1},{position:9,points:0},{position:10,points:0}];else w.answers.scoringConfig=[{position:1,points:10},{position:2,points:6},{position:3,points:5},{position:4,points:4},{position:5,points:3},{position:6,points:2},{position:7,points:1},{position:8,points:1},{position:9,points:0},{position:10,points:0}];wizardNext();return}wizardNext()}
function wizardChooseMode(label){const w=ui.wizard;if(!w)return;const g=GAME_MODES.find(x=>x[0]===label);if(!g)return;const a=w.answers,size=g[2];wizardRecordUser(label);a.mode=label;a.matchType=g[1];a.teamSize=size;a.squadType=g[1]==='BR'?'Squad':(size===1?'Solo':size===2?'Duo':'Squad');if(g[1]==='BR'){if(!a.maps||!a.maps.length)a.maps=['Erangel'];if(a._br){a.slots=a._br.slots;a.stageFormat=a._br.stageFormat;a.allowPartialSquads=a._br.allowPartialSquads;a._br=null}}else{/* custom modes: short flow, background defaults */if(!wizardTeamSizes(label).includes(a._tsel||'')){a.matchType='1v1';a.teamSize=1;a.squadType='Solo'}else{a.matchType=a._tsel;a.teamSize=+a._tsel[0];a.squadType=a.teamSize===1?'Solo':a.teamSize===2?'Duo':'Squad'}if(!a._br){a._br={slots:a.slots,stageFormat:a.stageFormat,allowPartialSquads:a.allowPartialSquads};a.slots=customModeSlots(label,g[1])}a.stageFormat='Single Match';a.allowPartialSquads=false;a.maps=[];if(!a.scoringConfig||!a.scoringConfig.length)a.scoringConfig=DEFAULT_POINTS.map(x=>({...x}));if(!a.perspective)a.perspective='TPP'}
if(g[1]!=='Wow Mod'){if(a.customMapCode&&a.customModCode===a.customMapCode)a.customModCode='';a.customMapCode=''}
if(g[1]==='Inventory Room')a.customModCode='';

async function handleAuth(e,mode){

      const _dd=String(f.get('dobDay')||''),_dm=String(f.get('dobMonth')||''),_dy=String(f.get('dobYear')||'');
      const dob=(_dd&&_dm&&_dy)?`${_dy}-${_dm.padStart(2,'0')}-${_dd.padStart(2,'0')}`:'';
      if(dob){const _t=new Date(Number(_dy),Number(_dm)-1,Number(_dd));if(_t.getFullYear()!==Number(_dy)||_t.getMonth()!==Number(_dm)-1||_t.getDate()!==Number(_dd))throw Error('Please enter a valid Date of Birth.')}
      if(!dob||isNaN(new Date(dob).getTime()))throw Error('Please enter a valid Date of Birth.');
      /* exact calendar age (the 365.25-day formula can wrongly block someone on their 18th birthday) */
      const _bd=new Date(dob+'T00:00:00'),_nd=new Date();let age=_nd.getFullYear()-_bd.getFullYear();const _md=_nd.getMonth()-_bd.getMonth();if(_md<0||(_md===0&&_nd.getDate()<_bd.getDate()))age--;

}

function cloudPersistState(){

  const uidAtStart=currentUser.uid,emailAtStart=currentUser.email||'',displayNameAtStart=currentUser.displayName||'Player';

async function approveWalletDeposit(id){
  if(!currentUser||ui.role!=='organizer'||!isAdminEmail()){toast('Admin access required.','error');return}

  wrBusy=true;
  try{
    const rRef=cloudDb.collection('wallet_requests').doc(String(id));let _dep=null;
    await withTimeout(cloudDb.runTransaction(async tx=>{
      const rs=await tx.get(rRef);if(!rs.exists)throw Error('Request no longer exists.');
      const d=rs.data();if(d.status!=='PENDING')throw Error('This request was already processed.');
      const amt=Number(d.amount),bon=Number(d.bonus)||0;
      if(!d.userId||!isFinite(amt)||amt<=0||!isFinite(bon)||bon<0)throw Error('Invalid request data.');

      tx.update(rRef,{status:'APPROVED',approvedAt:Date.now(),processedBy:currentUser.uid});_dep={uid:d.userId,amt};

    if(_dep)atariPushUsers([_dep.uid],'💰 Wallet credited','₹'+_dep.amt+' added to your wallet.');

submitRegistration = async function(e,id){

async function submitWithdrawal(e){
  e.preventDefault();if(ui.modalBusy)return;
  const form=e.currentTarget,f=new FormData(form),errEl=document.getElementById('wd-error');
  const setErr=m=>{if(errEl)errEl.textContent=m;toast(m,'error')};
  if(!currentUser||!cloudDb){setErr('Please sign in first.');return}
  const upiId=String(f.get('upiId')||'').trim(),amount=Number(f.get('amount'));
  if(!/^[A-Za-z0-9._\-]{2,}@[A-Za-z][A-Za-z0-9.\-]{1,}$/.test(upiId)){setErr('Enter a valid UPI ID (e.g. name@upi).');return}
  if(!Number.isFinite(amount)||amount<=0||!Number.isInteger(amount)){setErr('Enter a valid whole-number amount.');return}
  if(amount<50){setErr('Minimum withdrawal amount is ₹50.');return}
  if(amount>((Number(state.profile.walletBalance)||0)+(Number(state.profile.bonusBalance)||0)+(Number(state.profile.winningsBalance)||0))){setErr('Insufficient balance. You cannot withdraw more than your available balance.');return}
  const file=form.elements.qrFile.files[0];
  if(!file){setErr('Please upload your QR code (required).');return}
  if(!file.type.startsWith('image/')||file.size>5*1024*1024){setErr('Upload a valid image up to 5 MB.');return}
  ui.modalBusy=true;const btn=document.getElementById('wd-submit');if(btn){btn.disabled=true;btn.textContent='Submitting…'}
  try{
    const qrCodeBase64=await compressImageFile(file,900,.8);
    const userRef=cloudDb.collection('users').doc(currentUser.uid),reqRef=cloudDb.collection('withdrawal_requests').doc();
    await withTimeout(cloudDb.runTransaction(async tx=>{
      const us=await tx.get(userRef);if(!us.exists)throw Error('User profile was not found.');
      const ud=us.data(),wallet=Math.max(0,Number(ud.walletBalance)||0),bonus=Math.max(0,Number(ud.bonusBalance)||0),winnings=Math.max(0,Number(ud.winningsBalance)||0);
      if(amount>wallet+bonus+winnings)throw Error('Insufficient balance. Your balance changed; please try again.');
      /* deduct Winnings first, then Deposit, then Bonus */
      const fromWinnings=Math.min(winnings,amount),fromDeposit=Math.min(wallet,amount-fromWinnings),fromBonus=amount-fromWinnings-fromDeposit;
      const upd={updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
      if(fromDeposit>0)upd.walletBalance=wallet-fromDeposit;
      if(fromBonus>0)upd.bonusBalance=bonus-fromBonus;
      if(fromWinnings>0)upd.winningsBalance=winnings-fromWinnings;
      tx.update(userRef,upd);
      const withdrawName=state.profile.displayName||currentUser.displayName||'Player';
      tx.set(reqRef,{userId:currentUser.uid,userName:withdrawName,userEmail:currentUser.email||'',totalBalance:wallet+bonus+winnings,deducted:{deposit:fromDeposit,bonus:fromBonus,winnings:fromWinnings},upiId,amount,qrCodeBase64,status:'PENDING',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }),30000);
    await atariPushUsers(['__admin__'],'💸 New withdrawal request',(state.profile.displayName||currentUser.displayName||'Player')+' requested a ₹'+amount+' withdrawal. Review it in Admin Updates.');
    closeModal();await refreshCloudUser();toast('Withdrawal request submitted. Amount deducted from your wallet.','success');
  }catch(ex){setErr(ex.message||'Withdrawal request failed.');if(btn){btn.disabled=false;btn.textContent='Submit Withdrawal Request'}}
  finally{ui.modalBusy=false}
}

async function rejectWithdrawal(id){
  if(ui.modalBusy)return;ui.modalBusy=true;
  try{
    const reqRef=cloudDb.collection('withdrawal_requests').doc(id);let rejectedWithdrawalUid='';let rejectedWithdrawalAmount=0;
    await withTimeout(cloudDb.runTransaction(async tx=>{
      const s=await tx.get(reqRef);if(!s.exists)throw Error('Request no longer exists.');
      const d=s.data();if(d.status!=='PENDING')throw Error('This request was already processed.');
      const amt=Number(d.amount)||0;if(amt<=0||!d.userId)throw Error('Invalid request data.');rejectedWithdrawalUid=String(d.userId);rejectedWithdrawalAmount=amt;
      const FVr=firebase.firestore.FieldValue,ded=d.deducted,refund={updatedAt:FVr.serverTimestamp()};
      if(ded&&typeof ded==='object'){
        const rd=Number(ded.deposit)||0,rb=Number(ded.bonus)||0,rw=Number(ded.winnings)||0;
        if(rd>0)refund.walletBalance=FVr.increment(rd);
        if(rb>0)refund.bonusBalance=FVr.increment(rb);
        if(rw>0)refund.winningsBalance=FVr.increment(rw);
        if(rd+rb+rw<=0)refund.walletBalance=FVr.increment(amt);
      }else refund.walletBalance=FVr.increment(amt);
      tx.update(cloudDb.collection('users').doc(d.userId),refund);
      tx.update(reqRef,{status:'REJECTED',rejectedAt:firebase.firestore.FieldValue.serverTimestamp(),processedBy:currentUser.uid});
    }),30000);
    if(rejectedWithdrawalUid)atariPushUsers([rejectedWithdrawalUid],'↩️ Withdrawal rejected','Your withdrawal request for ₹'+money(rejectedWithdrawalAmount)+' was rejected and the amount was refunded to your wallet.');
    closeModal();logEvent('Withdrawal rejected and refunded');toast('Request rejected and amount refunded to the user.','success');loadAdminWithdrawals();
  }catch(ex){toast(ex.message||'Could not reject request.','error')}
  finally{ui.modalBusy=false}
}

function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function igUrl(h){h=String(h||'').trim();if(/^https?:\/\//i.test(h))return safeUrl(h);return 'https://www.instagram.com/'+encodeURIComponent(h.replace(/^@/,'').replace(/\s+/g,''))+'/'}

function aiCard(v){

  const msg=`🤖 AI Bot Notification:\nHi ${esc(v.playerName)}, your team ${esc(v.teamName)} played ${esc(v.matchName)}.\nPlease complete the following before ${esc(new Date(v.deadline).toLocaleString())}:\n1. Send your 2-3 min Fight POV to our Instagram: ${igHtml}.\n2. Upload your Detailed Stats Screenshot here.${vidHtml}\n3. Upload 4-5 Fight Screenshots here.\n⚠️ WARNING: 3 strikes = Team Disqualified.`;
  const note=st==='SUBMITTED'?'Your submission is under review by the Admin.':st==='VERIFIED'?'Your POV and Stats have been approved by the Admin.':st==='BANNED'?'You have been banned from this tournament due to rule violations.'+(v.banReason?' Reason: '+v.banReason:''):'';
  const noteColor=st==='BANNED'?'#fca5a5':st==='VERIFIED'?'#86efac':'#fde68a';
  const shots=(st==='SUBMITTED'||st==='VERIFIED')&&v.statsShot?`<div class="row" style="gap:6px;flex-wrap:wrap">${miniThumb(v.statsShot,'Stats')}${(v.fightShots||[]).map((x,i)=>miniThumb(x,'Fight '+(i+1))).join('')}</div>`:'';
  const form=st==='PENDING'?`<div class="field"><label>Detailed Stats Screenshot</label><input type="file" id="st-${id}" accept="image/*"></div><div class="field"><label>Fight Screenshots (4-5)</label><input type="file" id="fs-${id}" accept="image/*" multiple></div><button class="btn primary full" onclick="submitAiProof('${v.id}','${id}')">Submit Proof</button>`:'';
  return `<div class="card" ${st==='BANNED'?'style="border:1px solid #dc2626"':''}><div class="row between"><strong>${esc(v.matchName)} · ${esc(v.teamName)}</strong>${verifBadge(v,late)}</div><div class="muted small">Strikes: ${v.strikes||0}/3</div>${st==='SUBMITTED'?`<div style="background:#facc15;color:#302300;border-radius:12px;padding:10px;margin:8px 0;font-weight:800">⏳ Verifying...<div style="font-weight:500;font-size:12px">${esc(note)}</div></div>`:st==='VERIFIED'?`<div style="background:#16a34a;color:#fff;border-radius:12px;padding:10px;margin:8px 0;font-weight:800">✅ Verification Complete<div style="font-weight:500;font-size:12px">${esc(note)}</div></div>`:st==='BANNED'?`<div style="background:#dc2626;color:#fff;border-radius:12px;padding:10px;margin:8px 0;font-weight:800">🚫 Banned<div style="font-weight:500;font-size:12px">${esc(note)}</div></div>`:''}${(st==='PENDING'||st==='SUBMITTED')?`<div style="white-space:pre-line;background:#120e17;border-radius:12px;padding:10px;margin:8px 0;font-size:13px">${msg}</div>`:''}${shots}${form}${st==='BANNED'?'':`<div class="row" style="gap:6px;margin-top:8px"><input id="rp-${id}" placeholder="Reply to AI Bot…" maxlength="300" style="flex:1"><button class="btn smallbtn" onclick="aiReply('${v.id}','${id}')">Reply</button></div>`}${(v.replies||[]).length?`<div class="muted small" style="margin-top:6px">${v.replies.map(x=>'You: '+esc(x.text)).join('<br>')}</div><button class="btn success full" style="margin-top:8px" onclick="plTab('chat')">📩 Chat with Admin</button>`:''}</div>`;
}

async function submitBanReason(id){
  const input=document.getElementById('ban-reason-input'),reason=String(input&&input.value||'').trim(),err=document.getElementById('ban-reason-error'),btn=document.getElementById('ban-reason-submit');
  if(!reason){if(err)err.textContent='A ban reason is required.';if(input)input.focus();return}

    const q=await cloudDb.collection('ai_verification_requests').where('teamId','==',v.teamId).get(),b=cloudDb.batch(),docs=q.docs.filter(d=>d.data().tournamentId===v.tournamentId);

  }catch(e){if(btn){btn.disabled=false;btn.textContent='Submit Ban'}toast(e.message||'Could not ban team.','error')}

async function pzLoadPaid(tid){try{const q=await cloudDb.collection('prize_transactions').where('tournamentId','==',tid).get(),m={};q.docs.forEach(d=>{const x=d.data();m[x.teamId]=(m[x.teamId]||0)+(Number(x.amount)||0)});PZ.paid[tid]=m}catch(e){console.error(e)}}

async function sendPrizes(){
  const t=getT(PZ.tid);if(!t||PZ.busy)return;
  const list=pzTeams(t).map(({r})=>({r,amt:Math.floor(Number(PZ.vals[r.id])||0)})).filter(x=>x.amt>0);
  if(!list.length){toast('Enter a prize amount for at least one team.','warning');return}
  const miss=list.filter(x=>!x.r.playerOwner);if(miss.length){toast('No linked wallet for: '+miss.map(x=>x.r.teamName).join(', '),'error');return}
  const total=list.reduce((a,x)=>a+x.amt,0);
  if(!confirm(`Are you sure you want to send these prizes?\n\n${list.length} team(s) · Total ₹${money(total)}`))return;
  const paid=PZ.paid[t.id]||{},dup=list.filter(x=>paid[x.r.id]);
  if(dup.length&&!confirm('Prize was already sent to: '+dup.map(x=>x.r.teamName).join(', ')+'.\n\nSend again?'))return;
  PZ.busy=true;const btn=document.getElementById('pz-send');if(btn){btn.disabled=true;btn.textContent='Sending…'}
  try{
    const FV=firebase.firestore.FieldValue,b=cloudDb.batch(),tname=t.name||t.title||'Tournament';
    list.forEach(({r,amt})=>{
      b.update(cloudDb.collection('users').doc(r.playerOwner),{winningsBalance:FV.increment(amt),updatedAt:FV.serverTimestamp()});
      b.set(cloudDb.collection('prize_transactions').doc(),{teamName:r.teamName,teamId:r.id,playerId:r.playerOwner,amount:amt,tournamentId:t.id,tournamentName:tname,timestamp:FV.serverTimestamp(),sentBy:currentUser.uid});
      b.set(cloudDb.collection('notifications').doc(),{userId:r.playerOwner,type:'PRIZE',text:`🎉 You have won ₹${money(amt)} in ${tname}!`,read:false,createdAt:Date.now()});
    });
    await b.commit();list.forEach(({r,amt})=>atariPushUsers([r.playerOwner],'🏆 Prize credited','₹'+money(amt)+' prize credited for '+tname+'.'));PZ.vals={};await pzLoadPaid(t.id);logEvent(`Prizes sent: ${tname} · ${list.length} team(s) · ₹${total}`);
    toast(`Prizes sent: ₹${money(total)} to ${list.length} team(s).`,'success');
    if(list.some(x=>x.r.playerOwner===currentUser.uid))refreshCloudUser();
  }catch(e){console.error(e);toast('Could not send prizes: '+(e.message||'error')+'. Nothing was sent.','error')}
  finally{PZ.busy=false;render()}
}

async function clearAllSystemLogs(){

  if(!confirm('Permanently delete ALL system logs? This cannot be undone.'))return;
  try{

async function cleanupOldData(){if(!currentUser||!cloudDb||ui.role==='organizer')return;const uid=currentUser.uid,cutoff=Date.now()-5*24*60*60*1000;const ms=v=>{if(v==null)return null;if(typeof v==='number')return v;if(v.toMillis)return v.toMillis();if(v.seconds)return v.seconds*1000;const n=Date.parse(v);return Number.isFinite(n)?n:null};try{const jobs=[];const verifs=await cloudDb.collection('ai_verification_requests').where('playerId','==',uid).get();const oldVerifs=verifs.docs.filter(d=>['VERIFIED','BANNED'].includes(String(d.data().status||'').toUpperCase())&&ms(d.data().createdAt)!==null&&ms(d.data().createdAt)<cutoff);oldVerifs.forEach(d=>jobs.push(d.ref.delete()));const dmRef=cloudDb.collection('private_dms').doc(uid),dmSnap=await dmRef.get();if(dmSnap.exists){const data=dmSnap.data(),messages=Array.isArray(data.messages)?data.messages:[],kept=messages.filter(m=>ms(m.timestamp)===null||ms(m.timestamp)>=cutoff);if(kept.length!==messages.length)jobs.push(dmRef.update({messages:kept,updatedAt:Date.now()}))}const notes=await cloudDb.collection('notifications').where('userId','==',uid).get();notes.docs.filter(d=>ms(d.data().createdAt)!==null&&ms(d.data().createdAt)<cutoff).forEach(d=>jobs.push(d.ref.delete()));await Promise.all(jobs)}catch(e){console.warn('5-day player cleanup could not finish:',e&&e.message||e)}}

async function recordReferralSignup(referredUid,code,email,displayName){

    const owners=await cloudDb.collection('users').where('referralCode','==',normalized).limit(1).get();
    if(owners.empty)return;
    const owner=owners.docs[0];if(owner.id===referredUid)return;
    const rec=cloudDb.collection('referral_records').doc(String(referredUid));
    const existing=await rec.get();if(existing.exists)return;

(function(){
  const SUB={'tournament-detail':'battle','organizer-detail':'tournaments'};
  let cur=null,applying=false,ready=false;
  const keyOf=()=>ui.page+'|'+(SUB[ui.page]?(ui.selectedTournamentId||''):'');
  const stateOf=()=>({atari:'app',page:ui.page,tid:ui.selectedTournamentId||null});
  const validPage=p=>SUB[p]?((p==='organizer-detail')===(ui.role==='organizer')):NAV[ui.role].some(n=>n[0]===p);
  const keyFor=(p,t)=>p+'|'+(SUB[p]?(t||''):'');
  function sync(){if(!ready||applying)return;const k=keyOf();if(k===cur)return;cur=k;try{history.pushState(stateOf(),'')}catch(e){}}
  function go(page,tid,mode){applying=true;try{ui.page=page;if(SUB[page]&&tid)ui.selectedTournamentId=tid;cur=keyOf();if(mode==='push'){try{history.pushState(stateOf(),'')}catch(e){}}else if(mode==='replace'){try{history.replaceState(stateOf(),'')}catch(e){}}render();window.scrollTo(0,0)}finally{applying=false}}
  function fallback(mode){
    if(SUB[ui.page]){go(SUB[ui.page],null,mode);return true}
    if(ui.page!=='home'){go('home',null,mode);return true}
    return false;
  }
  window.addEventListener('popstate',function(e){
    if(!ready)return;
    try{
      const mr=document.getElementById('modal-root');
      if(mr&&mr.children.length){closeModal();try{history.pushState(stateOf(),'')}catch(x){}cur=keyOf();return}
      const s=e.state;
      if(s&&s.atari==='app'){
        let page=s.page,tid=s.tid;
        if(SUB[page]&&!(tid&&typeof getT==='function'&&getT(tid)))page=null;
        if(page&&validPage(page)){
          if(keyFor(page,tid)!==keyOf()){go(page,tid);return}
        }
        fallback('replace');
        return;
      }
      /* reached the bottom (root) entry or an unknown entry */
      if(fallback('push'))return;
      /* already on Home with nothing left: let the app/browser exit */
      ready=false;history.back();
    }catch(err){console.error('back-nav',err)}
  });
  const _nav=navigateTo;navigateTo=function(){const r=_nav.apply(this,arguments);sync();return r};
  const _open=openTournament;openTournament=function(){const r=_open.apply(this,arguments);sync();return r};
  const _openTab=openOrganizerTab;openOrganizerTab=function(){const r=_openTab.apply(this,arguments);sync();return r};
  const _render=render;render=function(){const out=_render.apply(this,arguments);sync();return out};
  try{
    const hs=history.state;
    if(hs&&hs.atari==='app'){history.replaceState(stateOf(),'')}
    else{history.replaceState({atari:'root'},'');history.pushState(stateOf(),'')}
    cur=keyOf();ready=true;
  }catch(e){}
})();
